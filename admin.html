<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Control Center — SCPHS</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; }

    /* Layout */
    .ac-layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .ac-sidebar {
      width: 240px;
      background: linear-gradient(180deg, #0f2b4f 0%, #1e3c72 100%);
      color: #fff;
      padding: 20px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .ac-sidebar-header {
      padding: 0 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }

    .ac-sidebar-header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ac-sidebar-header p {
      margin: 6px 0 0;
      font-size: 0.75rem;
      opacity: 0.75;
    }

    .ac-nav { padding: 0 12px; }

    .ac-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      transition: all .15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      margin-bottom: 3px;
    }

    .ac-nav-item:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .ac-nav-item.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-weight: 700;
      box-shadow: inset 3px 0 0 #7dd3fc;
    }

    .ac-nav-item .ico { font-size: 1.1rem; flex-shrink: 0; }

    .ac-sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .ac-sidebar-footer a {
      color: #fff;
      text-decoration: none;
      display: block;
      padding: 6px 0;
    }

    .ac-sidebar-footer a:hover { text-decoration: underline; }

    /* Main content */
    .ac-main { flex: 1; min-width: 0; padding: 24px; }

    .ac-page-header {
      margin-bottom: 20px;
    }

    .ac-page-header h2 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      color: #0f2b4f;
    }

    .ac-page-header p {
      margin: 0;
      color: #6b7280;
      font-size: 0.9rem;
    }

    /* Cards */
    .ac-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .ac-card h3 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: #0f2b4f;
    }

    /* Buttons */
    .ac-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s;
      text-decoration: none;
    }

    .ac-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .ac-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ac-btn.primary { background: #1e3c72; color: #fff; }
    .ac-btn.success { background: #059669; color: #fff; }
    .ac-btn.warning { background: #d97706; color: #fff; }
    .ac-btn.danger { background: #dc2626; color: #fff; }
    .ac-btn.outline { background: #fff; color: #1e3c72; border: 1px solid #1e3c72; }
    .ac-btn.small { padding: 6px 12px; font-size: 12px; }

    /* Toolbar */
    .ac-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .ac-search {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .ac-search:focus { border-color: #1e6bb8; box-shadow: 0 0 0 3px rgba(30,107,184,.12); }

    .ac-select {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      cursor: pointer;
    }

    /* Tables */
    .ac-table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .ac-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .ac-table th {
      background: #1e3c72;
      color: #fff;
      padding: 12px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .ac-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }

    .ac-table tbody tr:hover { background: #f9fafb; }
    .ac-table tbody tr:last-child td { border-bottom: 0; }

    .ac-table .col-actions { text-align: right; white-space: nowrap; }

    .ac-table select,
    .ac-table input {
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      max-width: 260px;
    }

    /* Badges */
    .ac-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .ac-badge.success { background: #d1fae5; color: #065f46; }
    .ac-badge.warning { background: #fef3c7; color: #92400e; }
    .ac-badge.danger { background: #fee2e2; color: #991b1b; }
    .ac-badge.info { background: #dbeafe; color: #1e40af; }

    /* Bulk assign panel */
    .ac-bulk-panel {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .ac-bulk-panel h4 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: #1e40af;
    }

    .ac-bulk-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ac-bulk-row select,
    .ac-bulk-row input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      min-width: 160px;
    }

    /* Stats */
    .ac-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .ac-stat {
      background: #f9fafb;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .ac-stat-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: #1e3c72;
      line-height: 1;
    }

    .ac-stat-label {
      font-size: 11px;
      color: #6b7280;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Loading */
    .ac-loading {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }
    .ac-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #1e3c72;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .ac-empty {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
      font-size: 0.9rem;
    }

    /* Toast */
    .ac-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      opacity: 0;
      transition: all .25s;
      z-index: 10000;
      pointer-events: none;
    }
    .ac-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .ac-toast.success { background: #059669; }
    .ac-toast.error { background: #b91c1c; }

    /* Mobile */
    @media (max-width: 768px) {
      .ac-layout { flex-direction: column; }
      .ac-sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 14px;
      }
      .ac-sidebar-header { padding: 0 6px 12px; margin-bottom: 10px; }
      .ac-nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 0;
      }
      .ac-nav-item {
        flex-shrink: 0;
        padding: 9px 14px;
        font-size: 0.82rem;
      }
      .ac-nav-item .ico { display: none; }
      .ac-sidebar-footer { display: none; }
      .ac-main { padding: 16px; }
    }

        /* ============================================================
       BoW Viewer (Session F2 Part 2)
       ============================================================ */
    .bow-modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      backdrop-filter: blur(2px);
    }
    .bow-modal.show { display: flex; }
    .bow-modal-panel {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 1100px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 48px rgba(0,0,0,.25);
      overflow: hidden;
    }
    .bow-modal-head {
      padding: 18px 22px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      background: #fff;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .bow-modal-head h3 { margin: 0 0 4px; font-size: 1.15rem; color: #0f2b4f; }
    .bow-modal-head .sub { margin: 0; font-size: 12px; color: #6b7280; }
    .bow-modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
    }
    .bow-modal-foot {
      padding: 14px 22px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #fafbfc;
      flex-wrap: wrap;
    }

    /* BoW topic section */
    .bow-topic-section {
      margin-bottom: 22px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }
    .bow-topic-head {
      background: linear-gradient(90deg, #eff6ff, #dbeafe);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .bow-topic-head:hover { background: linear-gradient(90deg, #dbeafe, #bfdbfe); }
    .bow-topic-label {
      font-weight: 800;
      color: #1e3c72;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bow-topic-count {
      font-size: 11px;
      font-weight: 700;
      background: #1e3c72;
      color: #fff;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .bow-topic-body {
      padding: 12px 14px;
      background: #fff;
    }
    .bow-topic-body.collapsed { display: none; }

    /* Competency row */
    .bow-comp-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      transition: all .15s;
    }
    .bow-comp-row:hover {
      background: #fff;
      border-color: #bfdbfe;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .bow-comp-main { flex: 1; min-width: 0; }
    .bow-comp-code {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 11px;
      color: #1e40af;
      font-weight: 700;
      background: #eff6ff;
      padding: 1px 8px;
      border-radius: 4px;
      margin-right: 6px;
      display: inline-block;
    }
    .bow-comp-recurring {
      color: #f59e0b;
      font-weight: 900;
      margin-right: 4px;
    }
    .bow-comp-text {
      font-size: 13.5px;
      color: #111827;
      line-height: 1.55;
      margin-top: 5px;
    }
    .bow-comp-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0.3;
      transition: opacity .15s;
    }
    .bow-comp-row:hover .bow-comp-actions { opacity: 1; }
    .bow-comp-actions button {
      border: none;
      background: #fff;
      border: 1px solid #e5e7eb;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      transition: all .15s;
    }
    .bow-comp-actions .edit:hover { background: #eff6ff; border-color: #1e6bb8; color: #1e40af; }
    .bow-comp-actions .del:hover { background: #fef2f2; border-color: #dc2626; color: #b91c1c; }
    .bow-comp-actions .copy:hover { background: #f0fdf4; border-color: #059669; color: #059669; }

    /* Standards blocks */
    .bow-standard-block {
      border-left: 4px solid #1e40af;
      background: #eff6ff;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      position: relative;
    }
    .bow-standard-block.perf { border-left-color: #166534; background: #f0fdf4; }
    .bow-standard-block .lbl {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px;
    }
    .bow-standard-block .txt {
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .bow-standard-block .edit-link {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #6b7280;
      font-family: inherit;
      opacity: 0;
      transition: opacity .15s;
    }
    .bow-standard-block:hover .edit-link { opacity: 1; }
    .bow-standard-block .edit-link:hover { color: #1e40af; }

    /* BoW stats row */
    .bow-stats-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      font-size: 12px;
      color: #6b7280;
    }
    .bow-stats-row strong { color: #0f2b4f; font-weight: 800; }

    /* Empty state */
    .bow-empty {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }

    /* Competency pill in table */
    .bow-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #eff6ff;
      color: #1e40af;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #bfdbfe;
      transition: all .15s;
    }
    .bow-pill:hover { background: #dbeafe; }
    .bow-pill.empty { background: #f3f4f6; color: #9ca3af; border-color: #e5e7eb; }
    .bow-pill.empty:hover { background: #e5e7eb; }
  </style>
</head>
<body>

  <div class="ac-layout">

    <!-- ============ SIDEBAR ============ -->
    <aside class="ac-sidebar">
      <div class="ac-sidebar-header">
        <h1>⚙️ Admin Center</h1>
        <p>Sta. Cruz Pingkian HS</p>
      </div>

      <nav class="ac-nav">
        <button class="ac-nav-item active" data-tab="classes">
          <span class="ico">🏫</span> Classes
        </button>
        <button class="ac-nav-item" data-tab="advisers">
          <span class="ico">👤</span> Advisers
        </button>
        <button class="ac-nav-item" data-tab="subjects">
          <span class="ico">📚</span> Subjects
        </button>
        <button class="ac-nav-item" data-tab="rooms">
          <span class="ico">🚪</span> Rooms
        </button>
        <button class="ac-nav-item" data-tab="conflicts">
          <span class="ico">⚠️</span> Conflicts
        </button>
      </nav>

      <div class="ac-sidebar-footer">
  <a href="index.html">← Back to Portal</a>
  <a href="manage-users.html">👥 Users</a>
  <a href="schedule-config.html">📅 Time Slots</a>
  <a href="admin-import-program.html">📥 Import Program</a>
</div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="ac-main" id="acMain">
      <div class="ac-loading">
        <div class="ac-spinner"></div>
        <div>Loading admin center…</div>
      </div>
    </main>

  </div>

  <div class="ac-toast" id="acToast"></div>

  <script type="module">
    import { auth, db } from "./assets/js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, getDocs, doc, updateDoc, deleteDoc, addDoc,
      query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getCurrentUserProfile } from "./assets/js/roles.js";

    // ⬇️ ADD THESE 3 LINES
    import "./assets/js/bow-parser.js";
    import "./assets/js/bow-store.js";
    import "./assets/js/bow-viewer.js";

    // ============================================================
    // STATE
    // ============================================================
    let CURRENT_USER = null;
    let CURRENT_PROFILE = null;
    let ACTIVE_TAB = "classes";
    let CLASSES = [];
    let USERS = [];
    let TIME_SLOTS = [];
    let PROGRAM = {};

    // ============================================================
    // UTILITIES
    // ============================================================
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    let toastTimer;
    function toast(msg, type = "") {
      const t = $("acToast");
      t.textContent = msg;
      t.className = "ac-toast show " + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = "ac-toast", 3000);
    }

    function sortClasses(classes) {
      const gradeOrder = [
        "Kindergarten", "Grade 1", "Grade 2", "Grade 3",
        "Grade 4", "Grade 5", "Grade 6",
        "Grade 7", "Grade 8", "Grade 9", "Grade 10",
        "Grade 11", "Grade 12"
      ];
      return [...classes].sort((a, b) => {
        const aIdx = gradeOrder.indexOf(a.gradeLevel);
        const bIdx = gradeOrder.indexOf(b.gradeLevel);
        if (aIdx !== bIdx) return aIdx - bIdx;
        return (a.section || "").localeCompare(b.section || "");
      });
    }

    // ============================================================
    // AUTH CHECK
    // ============================================================
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.replace("login.html?next=" + encodeURIComponent(location.pathname + location.search));
        return;
      }

      CURRENT_USER = user;
      CURRENT_PROFILE = await getCurrentUserProfile();

      const isAdmin = CURRENT_PROFILE?.primaryRole === "admin"
        || CURRENT_PROFILE?.isSuperAdmin
        || CURRENT_PROFILE?.permissions?.canManageClasses === true;

      if (!isAdmin) {
        $("acMain").innerHTML = `
          <div class="ac-card" style="text-align:center;padding:60px;">
            <h2 style="color:#b91c1c;">🚫 Access Denied</h2>
            <p>Only admins can access the control center.</p>
            <a href="index.html" class="ac-btn primary" style="margin-top:14px;">← Back to Portal</a>
          </div>`;
        return;
      }

      await loadAllData();
      renderActiveTab();
      attachSidebarHandlers();
      handleUrlHash();
    });

    // ============================================================
    // DATA LOADING
    // ============================================================
    async function loadAllData() {
      try {
        // Load classes
        const classSnap = await getDocs(collection(db, "classes"));
        CLASSES = classSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        CLASSES = sortClasses(CLASSES);

        // Load users (for adviser dropdowns)
        const userSnap = await getDocs(collection(db, "users"));
        USERS = userSnap.docs.map(d => ({ uid: d.id, ...d.data() }))
          .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

        // Load time slots (for subjects tab)
        try {
          const { loadTimeSlots, ensureTimeSlotsExist } = await import("./assets/js/schedule-config.js");
          TIME_SLOTS = await ensureTimeSlotsExist() || [];
        } catch { TIME_SLOTS = []; }

        // Load student counts per class
        for (const cls of CLASSES) {
          try {
            const studentsSnap = await getDocs(collection(db, "classes", cls.id, "students"));
            cls.studentCount = studentsSnap.size;
          } catch { cls.studentCount = 0; }
        }
      } catch (e) {
        console.error("[admin] load failed:", e);
        toast("⚠️ Failed to load data", "error");
      }
    }

    // ============================================================
    // SIDEBAR & ROUTING
    // ============================================================
    function attachSidebarHandlers() {
      document.querySelectorAll(".ac-nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          switchTab(tab);
        });
      });
    }

    function switchTab(tab) {
      ACTIVE_TAB = tab;

    // ============================================================
    // RESOLUTIONS — persisted in Firestore
    // ============================================================
    async function loadResolutions() {
      try {
        const snap = await getDocs(collection(db, "conflict_resolutions"));
        CONFLICT_RESOLUTIONS = {};
        snap.docs.forEach(d => {
          CONFLICT_RESOLUTIONS[d.id] = d.data();
        });
      } catch {
        CONFLICT_RESOLUTIONS = {};
      }
    }

    async function markResolved(conflictId) {
      const key = resolveKey(conflictId);
      try {
        const docRef = doc(db, "conflict_resolutions", key);
        await updateDoc(docRef, {
          resolvedAt: serverTimestamp(),
          resolvedBy: CURRENT_USER?.email || "",
          conflictId,
        }).catch(async () => {
          await addDoc(collection(db, "conflict_resolutions"), {
            conflictId,
            resolvedAt: serverTimestamp(),
            resolvedBy: CURRENT_USER?.email || "",
          });
        });
        CONFLICT_RESOLUTIONS[key] = { resolvedAt: new Date() };
        return true;
      } catch (e) {
        // Fallback: just track locally
        CONFLICT_RESOLUTIONS[key] = { resolvedAt: new Date() };
        return true;
      }
    }

    function resolveKey(conflictId) {
      // Firestore doc IDs can't contain "/", so replace with "_"
      return "res_" + conflictId.replace(/\//g, "_").replace(/\s+/g, "_").slice(0, 400);
    }

    function isResolved(conflictId) {
      return !!CONFLICT_RESOLUTIONS[resolveKey(conflictId)];
    }

    // ============================================================
    // SCAN FOR CONFLICTS
    // ============================================================
    async function scanForConflicts(term) {
      const btn = $("btnScanConflicts");
      btn.disabled = true;
      btn.textContent = "Scanning…";

      $("conflictResults").innerHTML = `
        <div class="ac-loading">
          <div class="ac-spinner"></div>
          <div>Loading programs for Term ${term}…</div>
        </div>
      `;

      try {
        await loadResolutions();

        // ---- 1. Load all class programs for this term ----
        const allPrograms = []; // { classId, className, gradeLevel, entries: [...] }
        for (const cls of CLASSES) {
          try {
            const snap = await getDocs(collection(db, "classes", cls.id, "program"));
            const entries = snap.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .filter(e => Number(e.term) === term);

            if (entries.length) {
              allPrograms.push({
                classId: cls.id,
                className: cls.classLabel || "(unnamed)",
                gradeLevel: cls.gradeLevel || "",
                section: cls.section || "",
                entries,
              });
            }
          } catch {
            // Skip classes that fail
          }
        }

        // ---- 2. Run detectors ----
        const teacherConflicts = detectTeacherClashes(allPrograms);
        const roomConflicts = detectRoomClashes(allPrograms);
        const orphanConflicts = detectOrphanedSlots(allPrograms);
        const dupPrimaryConflicts = detectDuplicatePrimaries(allPrograms);

        CONFLICTS = [
          ...teacherConflicts,
          ...roomConflicts,
          ...orphanConflicts,
          ...dupPrimaryConflicts,
        ];

        CONFLICT_SCAN_DONE = true;
        renderConflictStats();
        renderConflictList();

        const totalActive = CONFLICTS.filter(c => !isResolved(c.id)).length;
        toast(
          totalActive === 0
            ? `✓ Scan complete — no conflicts in Term ${term}`
            : `⚠️ Scan complete — ${totalActive} conflict(s) in Term ${term}`,
          totalActive === 0 ? "success" : "error"
        );
      } catch (e) {
        console.error("[conflicts] scan failed:", e);
        $("conflictResults").innerHTML = `
          <div class="ac-empty">
            <div style="font-size:2.5rem;margin-bottom:8px;">⚠️</div>
            <h3 style="color:#b91c1c;margin:0 0 6px;">Scan Failed</h3>
            <p>${esc(e.message || "Unknown error")}</p>
          </div>
        `;
        toast("⚠️ " + (e.message || "Scan failed"), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "🔍 Scan for Conflicts";
      }
    }

    // ============================================================
    // DETECTOR: Teacher double-booking (across classes)
    // ============================================================
    function detectTeacherClashes(allPrograms) {
      // teacherUid+day+timeSlotId → [ { classId, className, subject, entryId } ]
      const map = {};
      for (const prog of allPrograms) {
        for (const e of prog.entries) {
          if (!e.teacherUid) continue;
          const key = `${e.teacherUid}|${e.day}|${e.timeSlotId}|${e.term}`;
          if (!map[key]) {
            map[key] = {
              teacherUid: e.teacherUid,
              teacherName: e.teacherName || e.teacherUid,
              day: e.day,
              timeSlotId: e.timeSlotId,
              term: e.term,
              hits: [],
            };
          }
          map[key].hits.push({
            classId: prog.classId,
            className: prog.className,
            gradeLevel: prog.gradeLevel,
            subject: e.subject || e.subjectName || "—",
            specialization: e.specialization || "",
            entryId: e.id,
            entryType: e.entryType || "primary",
          });
        }
      }

      const conflicts = [];
      for (const [key, g] of Object.entries(map)) {
        // Only flag if 2+ DISTINCT classes are involved
        const distinctClasses = new Set(g.hits.map(h => h.classId));
        if (distinctClasses.size >= 2) {
          conflicts.push({
            id: `teacher|${g.teacherUid}|${g.day}|${g.timeSlotId}|T${g.term}`,
            type: "teacher",
            severity: "high",
            title: `Teacher double-booked: ${g.teacherName}`,
            description: `${g.teacherName} is scheduled in ${distinctClasses.size} classes at the same time.`,
            day: g.day,
            timeSlotId: g.timeSlotId,
            term: g.term,
            hits: g.hits,
          });
        }
      }
      return conflicts;
    }

    // ============================================================
    // DETECTOR: Duplicate teacher in the SAME class+slot
    // (ignores legitimate TLE rotation with distinct specs)
    // ============================================================
    function detectDuplicatePrimaries(allPrograms) {
      const conflicts = [];
      for (const prog of allPrograms) {
        // Group by day+timeSlotId
        const slotMap = {};
        for (const e of prog.entries) {
          const k = `${e.day}|${e.timeSlotId}`;
          if (!slotMap[k]) slotMap[k] = [];
          slotMap[k].push(e);
        }

        for (const [k, entries] of Object.entries(slotMap)) {
          const [day, timeSlotId] = k.split("|");

          // Rule A: More than one PRIMARY entry
          const primaries = entries.filter(e => (e.entryType || "primary") === "primary");
          if (primaries.length >= 2) {
            conflicts.push({
              id: `dup-primary|${prog.classId}|${day}|${timeSlotId}|T${prog.entries[0].term}`,
              type: "dup-primary",
              severity: "low",
              title: `Multiple primary entries in ${prog.className}`,
              description: `${primaries.length} "primary" entries in the same slot — only one should be primary.`,
              day,
              timeSlotId,
              term: prog.entries[0].term,
              hits: primaries.map(e => ({
                classId: prog.classId,
                className: prog.className,
                gradeLevel: prog.gradeLevel,
                subject: e.subject || e.subjectName || "—",
                specialization: e.specialization || "",
                teacherName: e.teacherName || "",
                entryId: e.id,
                entryType: e.entryType || "primary",
              })),
            });
          }

          // Rule B: Same teacher appearing twice with matching/empty specs
          const byTeacher = {};
          for (const e of entries) {
            if (!e.teacherUid) continue;
            if (!byTeacher[e.teacherUid]) byTeacher[e.teacherUid] = [];
            byTeacher[e.teacherUid].push(e);
          }
          for (const [uid, list] of Object.entries(byTeacher)) {
            if (list.length < 2) continue;
            const specs = new Set(list.map(e => e.specialization || "__EMPTY__"));
            // If all have the SAME spec (or all empty) → likely a duplicate, not rotation
            if (specs.size === 1) {
              conflicts.push({
                id: `dup-teacher|${prog.classId}|${uid}|${day}|${timeSlotId}|T${prog.entries[0].term}`,
                type: "teacher-dup",
                severity: "high",
                title: `Teacher repeated in same slot: ${list[0].teacherName || uid}`,
                description: `${list[0].teacherName || uid} appears ${list.length} times in ${prog.className} at the same day/slot.`,
                day,
                timeSlotId,
                term: prog.entries[0].term,
                hits: list.map(e => ({
                  classId: prog.classId,
                  className: prog.className,
                  gradeLevel: prog.gradeLevel,
                  subject: e.subject || e.subjectName || "—",
                  specialization: e.specialization || "",
                  teacherName: e.teacherName || "",
                  entryId: e.id,
                  entryType: e.entryType || "primary",
                })),
              });
            }
          }
        }
      }
      return conflicts;
    }

    // ============================================================
    // DETECTOR: Room double-booking (across classes)
    // ============================================================
    function detectRoomClashes(allPrograms) {
      const map = {}; // room|day|timeSlotId|term → hits
      for (const prog of allPrograms) {
        for (const e of prog.entries) {
          const room = String(e.room || "").trim();
          if (!room) continue;
          const key = `${room}|${e.day}|${e.timeSlotId}|${e.term}`;
          if (!map[key]) {
            map[key] = {
              room, day: e.day, timeSlotId: e.timeSlotId, term: e.term, hits: [],
            };
          }
          map[key].hits.push({
            classId: prog.classId,
            className: prog.className,
            gradeLevel: prog.gradeLevel,
            subject: e.subject || e.subjectName || "—",
            teacherName: e.teacherName || "",
            entryId: e.id,
          });
        }
      }

      const conflicts = [];
      for (const [key, g] of Object.entries(map)) {
        const distinctClasses = new Set(g.hits.map(h => h.classId));
        if (distinctClasses.size >= 2) {
          conflicts.push({
            id: `room|${g.room}|${g.day}|${g.timeSlotId}|T${g.term}`,
            type: "room",
            severity: "medium",
            title: `Room double-booked: ${g.room}`,
            description: `${g.room} is used by ${distinctClasses.size} classes at the same time.`,
            day: g.day,
            timeSlotId: g.timeSlotId,
            term: g.term,
            hits: g.hits,
          });
        }
      }
      return conflicts;
    }

    // ============================================================
    // DETECTOR: Orphaned TLE slot (has "additional" but no "primary")
    // ============================================================
    function detectOrphanedSlots(allPrograms) {
      const conflicts = [];
      for (const prog of allPrograms) {
        const slotMap = {};
        for (const e of prog.entries) {
          const k = `${e.day}|${e.timeSlotId}`;
          if (!slotMap[k]) slotMap[k] = [];
          slotMap[k].push(e);
        }

        for (const [k, entries] of Object.entries(slotMap)) {
          if (entries.length < 2) continue;
          const hasPrimary = entries.some(e => (e.entryType || "primary") === "primary");
          const hasAdditional = entries.some(e => e.entryType === "additional");
          if (hasAdditional && !hasPrimary) {
            const [day, timeSlotId] = k.split("|");
            conflicts.push({
              id: `orphan|${prog.classId}|${day}|${timeSlotId}|T${entries[0].term}`,
              type: "orphan",
              severity: "low",
              title: `Orphaned TLE slot in ${prog.className}`,
              description: `${entries.length} "additional" entries but no "primary" entry for this slot.`,
              day,
              timeSlotId,
              term: entries[0].term,
              hits: entries.map(e => ({
                classId: prog.classId,
                className: prog.className,
                subject: e.subject || e.subjectName || "—",
                specialization: e.specialization || "",
                teacherName: e.teacherName || "",
                entryId: e.id,
                entryType: e.entryType,
              })),
            });
          }
        }
      }
      return conflicts;
    }

    function renderConflictStats() {
      const total = CONFLICTS.length;
      const teacher = CONFLICTS.filter(c => c.type === "teacher" || c.type === "teacher-dup").length;
      const room = CONFLICTS.filter(c => c.type === "room").length;
      const other = CONFLICTS.filter(c => c.type === "orphan" || c.type === "dup-primary").length;

      $("statTotalConflicts").textContent = total || "—";
      $("statTeacherConflicts").textContent = total ? teacher : "—";
      $("statRoomConflicts").textContent = total ? room : "—";
      $("statOtherConflicts").textContent = total ? other : "—";
    }

    // ------------------------------------------------------------
    // SCAN PROGRAMS FOR USAGE
    // ------------------------------------------------------------
    async function scanProgramsForSubjects(term) {
      const host = $("subjectResults");
      host.innerHTML = `
        <div class="ac-loading">
          <div class="ac-spinner"></div>
          <div>Scanning Term ${term} programs…</div>
        </div>
      `;

      try {
        SUBJECT_USAGE = {};

        // Iterate all classes
        for (const cls of CLASSES) {
          try {
            const snap = await getDocs(collection(db, "classes", cls.id, "program"));
            snap.docs
              .map(d => d.data())
              .filter(e => Number(e.term) === term)
              .forEach(e => {
                const code = (e.subject || e.subjectName || "").trim();
                if (!code) return;
                if (!SUBJECT_USAGE[code]) {
                  SUBJECT_USAGE[code] = {
                    code,
                    classes: [],
                    teachers: new Set(),
                    specializations: new Set(),
                    count: 0,
                  };
                }
                const u = SUBJECT_USAGE[code];
                u.count++;
                u.classes.push({
                  classId: cls.id,
                  className: cls.classLabel || "(unnamed)",
                  gradeLevel: cls.gradeLevel || "",
                });
                if (e.teacherName) u.teachers.add(e.teacherName);
                if (e.specialization) u.specializations.add(e.specialization);
              });
          } catch {
            // Skip classes that fail
          }
        }

        // Convert Sets to Arrays for rendering
        Object.values(SUBJECT_USAGE).forEach(u => {
          u.teachers = Array.from(u.teachers);
          u.specializations = Array.from(u.specializations);
        });

        SUBJECT_SCAN_DONE = true;
        renderSubjectStats();
        renderSubjectList();
      } catch (e) {
        console.error("[subjects] scan failed:", e);
        host.innerHTML = `
          <div class="ac-empty">
            <div style="font-size:2.5rem;margin-bottom:8px;">⚠️</div>
            <h3 style="color:#b91c1c;margin:0 0 6px;">Scan Failed</h3>
            <p>${esc(e.message || "Unknown error")}</p>
          </div>
        `;
      }
    }

    // ------------------------------------------------------------
    // MERGE METADATA + USAGE
    // ------------------------------------------------------------
    function getAllSubjectRecords() {
      const byCode = {};

      // 1. From saved metadata
      SUBJECTS.forEach(s => {
        byCode[s.id] = {
          code: s.id,
          displayName: s.displayName || s.id,
          shortName: s.shortName || "",
          family: s.family || "",
          type: s.type || "",
          level: s.level || "",
          curriculum: s.curriculum || "",
          cluster: s.cluster || "",
          requiredFor: s.requiredFor || [],
          description: s.description || "",
          active: s.active !== false,
          colorTag: s.colorTag || "",
          managed: true,
          seedSource: s.seedSource || "",
          usage: SUBJECT_USAGE[s.id] || { classes: [], teachers: [], specializations: [], count: 0 },
        };
      });

      // 2. From program usage (if not already in metadata)
      Object.values(SUBJECT_USAGE).forEach(u => {
        if (!byCode[u.code]) {
          byCode[u.code] = {
            code: u.code,
            displayName: u.code,
            shortName: "",
            family: detectFamily(u.code),
            type: "core",
            level: detectLevel(u.code),
            curriculum: "MATATAG",
            cluster: "",
            requiredFor: [],
            description: "",
            active: true,
            colorTag: "",
            managed: false,
            seedSource: "auto-detected",
            usage: u,
          };
        } else {
          // Enrich metadata-only entries with usage
          byCode[u.code].usage = u;
        }
      });

      return Object.values(byCode).sort((a, b) => {
        // Sort: managed first, then by level, then code
        if (a.managed !== b.managed) return a.managed ? -1 : 1;
        const la = String(a.level).padStart(3, "0");
        const lb = String(b.level).padStart(3, "0");
        if (la !== lb) return la.localeCompare(lb);
        return a.code.localeCompare(b.code);
      });
    }

    // ------------------------------------------------------------
    // STATS
    // ------------------------------------------------------------
    function renderSubjectStats() {
      const all = getAllSubjectRecords();
      const families = new Set(all.map(s => s.family).filter(Boolean));
      const managed = all.filter(s => s.managed).length;
      const inPrograms = all.filter(s => (s.usage?.count || 0) > 0).length;

      $("statTotalSubjects").textContent = all.length || "—";
      $("statFamilies").textContent = families.size || "—";
      $("statManaged").textContent = managed;
      $("statInPrograms").textContent = inPrograms;
    }

    // ------------------------------------------------------------
    // LIST
    // ------------------------------------------------------------
    function renderSubjectList() {
      if (!SUBJECT_SCAN_DONE && !SUBJECTS.length) return;

      const host = $("subjectResults");
      const term = ($("subjectSearch")?.value || "").toLowerCase().trim();

      let list = getAllSubjectRecords();

      // Filters
      if (term) {
        list = list.filter(s =>
          s.code.toLowerCase().includes(term) ||
          (s.displayName || "").toLowerCase().includes(term) ||
          (s.family || "").toLowerCase().includes(term)
        );
      }
      if (LEVEL_FILTER) list = list.filter(s => String(s.level) === LEVEL_FILTER);
      if (CURRICULUM_FILTER) list = list.filter(s => s.curriculum === CURRICULUM_FILTER);
      if (TYPE_FILTER) list = list.filter(s => s.type === TYPE_FILTER);

      if (!list.length) {
        host.innerHTML = `
          <div class="ac-empty">
            <div style="font-size:2.5rem;margin-bottom:8px;">📭</div>
            <p>No subjects match the current filters.</p>
          </div>
        `;
        return;
      }

      // Group by family
      const grouped = {};
      for (const s of list) {
        const fam = s.family || "(uncategorized)";
        if (!grouped[fam]) grouped[fam] = [];
        grouped[fam].push(s);
      }

      const sortedFamilies = Object.keys(grouped).sort();

      host.innerHTML = sortedFamilies.map(family => {
        const color = familyColor(family);
        return `

    // ------------------------------------------------------------
    // SEED OFFICIAL CATALOG
    // ------------------------------------------------------------
    async function seedOfficialSubjects() {
      if (!confirm("Seed the official DepEd K-12 catalog?\n\nThis will ADD missing subjects. Existing entries will be preserved.")) return;

      const btn = $("btnSeedSubjects");
      btn.disabled = true;
      btn.textContent = "Seeding…";

      const OFFICIAL = getOfficialCatalog();
      let inserted = 0, skipped = 0, errors = 0;

      try {
        for (const s of OFFICIAL) {
          try {
            const existing = SUBJECTS.find(x => x.id === s.code);
            if (existing) { skipped++; continue; }

            const docRef = doc(db, "subjects", s.code);
            const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
            await setDoc(docRef, {
              ...s,
              active: true,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp(),
              updatedBy: CURRENT_USER?.email || "",
              seedSource: "DO-009-s-2026",
            });
            inserted++;
          } catch (err) {
            console.error("Seed error:", s.code, err);
            errors++;
          }
        }

        toast(`✓ Seeded ${inserted} · Skipped ${skipped}${errors ? " · Errors " + errors : ""}`, "success");
        await loadSubjects();
        renderSubjectList();
      } catch (e) {
        toast("⚠️ " + (e.message || "Seed failed"), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "🌱 Seed Official Catalog";
      }
    }

    // ------------------------------------------------------------
    // OFFICIAL DEPED CATALOG (MATATAG K-10 + Strengthened SHS + Legacy K-12)
    // ------------------------------------------------------------
    function getOfficialCatalog() {
      const list = [];

      const push = (code, displayName, family, level, type, curriculum, cluster = "", requiredFor = []) => {
        list.push({ code, displayName, family, level, type, curriculum, cluster, requiredFor, description: "" });
      };

      // ===== KINDERGARTEN (MATATAG) =====
      push("K-MAKABANSA", "Makabansa", "Makabansa", "K", "core", "MATATAG");
      push("K-LANG", "Language", "Languages", "K", "core", "MATATAG");
      push("K-PNE", "Physical and Natural Environment", "Physical & Natural Environment", "K", "core", "MATATAG");
      push("K-MATH", "Mathematics", "Mathematics", "K", "core", "MATATAG");
      push("K-GMRC", "Good Manners and Right Conduct", "GMRC", "K", "core", "MATATAG");

      // ===== GRADES 1-3 (MATATAG — Key Stage 1) =====
      ["1","2","3"].forEach(g => {

    // ------------------------------------------------------------
    // FAMILY / LEVEL DETECTION
    // ------------------------------------------------------------
    function detectFamily(code) {
      const c = String(code || "").toUpperCase();
      if (c.startsWith("MATH") || c.startsWith("G") && c.includes("-MATH")) return "Mathematics";
      if (c.startsWith("ENG") || c.startsWith("G") && c.includes("-ENG")) return "English";
      if (c.startsWith("SCI") || c.startsWith("G") && c.includes("-SCI")) return "Science";
      if (c.startsWith("FIL") || c.startsWith("G") && c.includes("-FIL")) return "Filipino";
      if (c.startsWith("AP") || c.startsWith("G") && c.includes("-AP")) return "Araling Panlipunan";
      if (c.startsWith("MAPEH") || c.startsWith("G") && c.includes("-MAPEH")) return "MAPEH";
      if (c.startsWith("ESP") || c.startsWith("VE") || c.startsWith("G") && c.includes("-VE")) return "Values Education";
      if (c.startsWith("TLE")) return "TLE";
      if (c.startsWith("EPP")) return "EPP";
      if (c.startsWith("HGP")) return "Homeroom Guidance";
      if (c.startsWith("ARAL")) return "ARAL";
      if (c.startsWith("K-MAKABANSA")) return "Makabansa";
      if (c.startsWith("K-LANG")) return "Languages";
      if (c.startsWith("K-PNE")) return "Physical & Natural Environment";
      if (c.startsWith("K-GMRC")) return "GMRC";
      if (c.startsWith("SHS-ACAD") || c.startsWith("SHS-TECH")) return c.startsWith("SHS-TECH") ? "TechPro" : "SHS Academic";
      if (c.startsWith("SHS-")) return "SHS Core";
      return "";
    }

    function detectLevel(code) {
      const c = String(code || "").toUpperCase();
      if (c.startsWith("K-")) return "K";
      const m = c.match(/(\d{1,2})/);
      if (m) return m[1];
      return "";
    }

    async function loadBoWCounts() {
      BOW_COUNTS = {};
      const codes = getAllSubjectRecords().map(s => s.code);
      for (const code of codes) {
        try {
          const terms = await window.BoW.listBoWTerms(code);
          const total = terms.reduce((s, t) => s + (t.totalCompetencies || 0), 0);
          BOW_COUNTS[code] = total;
        } catch (e) {
          BOW_COUNTS[code] = 0;
        }
      }
    }

        return isAdminViewer

          : `<span class="bow-pill empty">—</span>`;
      }
      return `<span class="bow-pill" data-bow-view="${esc(subjectCode)}" title="View Budget of Work">
        📘 ${count}

      // Load data
      try {

        if (!termDoc) {
          modal.querySelector(".bow-modal-body").innerHTML = renderBoWEmptyState(subjectCode, subjectName);

          if (uploadBtn) {

        }

        const comps = await window.BoW.listCompetencies(subjectCode, term);

        modal.querySelector(".bow-modal-head").innerHTML = renderBoWViewerHead(subjectName, termDoc, term);

    // ------------------------------------------------------------
    // Viewer: Empty state
    // ------------------------------------------------------------
    function renderBoWEmptyState(subjectCode, subjectName) {
      const isStaff = CURRENT_PROFILE?.isSuperAdmin
        || CURRENT_PROFILE?.primaryRole === "admin"
        || CURRENT_PROFILE?.primaryRole === "teacher";

      return `
        <div class="bow-empty">
          <div style="font-size:3rem;">📭</div>
          <h3 style="color:#374151;margin:12px 0 6px;">No BoW uploaded yet</h3>
          <p>This subject has no Budget of Work for Term ${BOW_VIEWER_STATE.term}.</p>
          ${isStaff ? `
            <button class="ac-btn success" data-bow-upload-in-viewer style="margin-top:14px;">
              📤 Upload BoW Now
            </button>
          ` : ""}
        </div>
      `;
    }

    // ------------------------------------------------------------
    // Viewer: Header (with role-aware buttons)
    // ------------------------------------------------------------
    function renderBoWViewerHead(subjectName, termDoc, term) {
      const isStaff = CURRENT_PROFILE?.isSuperAdmin
        || CURRENT_PROFILE?.primaryRole === "admin"
        || CURRENT_PROFILE?.primaryRole === "teacher";

      const totalComps = termDoc.totalCompetencies || 0;
      const totalTopics = termDoc.totalTopics || 0;

      return `
        <div>
          <h3>📘 Budget of Work — ${esc(subjectName)}</h3>
          <p class="sub">
            ${esc(termDoc.termLabel || "Term " + term)}
            · ${totalComps} competencies
            · ${totalTopics} topics
            ${termDoc.schoolYear ? " · " + esc(termDoc.schoolYear) : ""}
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          ${isStaff ? `
            <button class="ac-btn success small" data-bow-add>➕ Add Competency</button>
            <button class="ac-btn outline small" data-bow-reupload>📤 Re-upload</button>
          ` : ""}
          <button class="ac-btn outline small" data-close-bow-viewer>✕ Close</button>
        </div>
      `;
    }

    // ------------------------------------------------------------
    // Viewer: Body (standards + filters + topics + competencies)
    // ------------------------------------------------------------
    function renderBoWViewerBody(termDoc, comps) {
      const isStaff = CURRENT_PROFILE?.isSuperAdmin
        || CURRENT_PROFILE?.primaryRole === "admin"
        || CURRENT_PROFILE?.primaryRole === "teacher";

      // Get unique topics
      const topics = [...new Set(comps.map(c => c.topicLabel))].filter(Boolean).sort();

      let html = "";

      // Content Standard
      if (termDoc.contentStandard) {
        html += `
          <div class="bow-standard-block" data-standard="content">
            <div class="lbl" style="color:#1e40af;">📘 Content Standard</div>
            <div class="txt" style="color:#1e3a8a;">${esc(termDoc.contentStandard)}</div>
            ${isStaff ? `<button class="edit-link" data-edit-standard="content">✏️ Edit</button>` : ""}
          </div>
        `;
      }

      // Performance Standard
      if (termDoc.performanceStandard) {
        html += `
          <div class="bow-standard-block perf" data-standard="performance">
            <div class="lbl" style="color:#166534;">⭐ Performance Standard</div>
            <div class="txt" style="color:#14532d;">${esc(termDoc.performanceStandard)}</div>
            ${isStaff ? `<button class="edit-link" data-edit-standard="performance">✏️ Edit</button>` : ""}
          </div>
        `;
      }

      // Filters
      html += `
        <div class="bow-stats-row" style="margin-top:18px;">
          <span>🔍 <strong>${comps.length}</strong> total competencies</span>
          <span>📂 <strong>${topics.length}</strong> topics</span>
          <span>🔁 <strong>${comps.filter(c => c.isRecurring).length}</strong> recurring</span>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
          <input type="search" class="ac-search" id="bowSearch" placeholder="🔍 Search competencies..." style="flex:1;min-width:200px;">
          <select class="ac-select" id="bowTopicFilter">
            <option value="">All Topics</option>
            ${topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}
          </select>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4b5563;padding:0 8px;cursor:pointer;">
            <input type="checkbox" id="bowRecurringFilter"> 🔁 Recurring only
          </label>
        </div>

        <div id="bowTopicList"></div>
      `;

      // Insert handler that renders topics after DOM is ready
      setTimeout(() => {
        renderBoWTopics(comps);
        wireBoWFilters(comps);
      }, 0);

      return html;
    }

    // ------------------------------------------------------------
    // Render topics + competencies list
    // ------------------------------------------------------------
    function renderBoWTopics(comps) {
      const host = document.getElementById("bowTopicList");
      if (!host) return;

      const { search, topic, recurringOnly } = BOW_VIEWER_STATE.filter;
      const isStaff = CURRENT_PROFILE?.isSuperAdmin
        || CURRENT_PROFILE?.primaryRole === "admin"
        || CURRENT_PROFILE?.primaryRole === "teacher";

      // Apply filters
      let filtered = comps.slice();
      if (search) {
        const s = search.toLowerCase();
        filtered = filtered.filter(c =>
          (c.code || "").toLowerCase().includes(s) ||
          (c.text || "").toLowerCase().includes(s)
        );
      }
      if (topic) filtered = filtered.filter(c => c.topicLabel === topic);
      if (recurringOnly) filtered = filtered.filter(c => c.isRecurring);

      if (!filtered.length) {
        host.innerHTML = `
          <div class="bow-empty">
            <div style="font-size:2rem;">🔍</div>
            <p style="margin-top:8px;">No competencies match the current filters.</p>
          </div>
        `;
        return;
      }

      // Group by topic
      const grouped = {};
      filtered.forEach(c => {
        const key = c.topicLabel || "(untitled)";
        if (!grouped[key]) {
          grouped[key] = {
            label: key,
            orderIndex: c.topicOrderIndex || 999,
            isCrossTerm: c.isCrossTerm,
            items: [],
          };
        }
        grouped[key].items.push(c);
      });

      // Sort topics by orderIndex
      const sortedTopics = Object.values(grouped).sort((a, b) => a.orderIndex - b.orderIndex);

      // Sort items within each topic by orderIndex
      sortedTopics.forEach(t => t.items.sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0)));

      host.innerHTML = sortedTopics.map(topic => {
        const crossTag = topic.isCrossTerm
          ? '<span style="background:#fef3c7;color:#92400e;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;">CROSS-TERM</span>'
          : "";

        return `
          <div class="bow-topic-section" data-topic="${esc(topic.label)}">
            <div class="bow-topic-head">
              <div class="bow-topic-label">
                ${esc(topic.label)}
                ${crossTag}
              </div>
              <span class="bow-topic-count">${topic.items.length}</span>
            </div>
            <div class="bow-topic-body">
              ${topic.items.map(c => renderBoWCompetencyRow(c, isStaff)).join("")}
            </div>
          </div>
        `;
      }).join("");

      // Attach handlers
      host.querySelectorAll(".bow-topic-head").forEach(head => {
        head.addEventListener("click", (e) => {
          if (e.target.closest("button")) return;
          const body = head.nextElementSibling;
          body.classList.toggle("collapsed");
        });
      });

      host.querySelectorAll("[data-bow-comp-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.bowCompEdit;
          const comp = BOW_VIEWER_STATE.competencies.find(c => c.id === id);
          if (comp) openCompetencyEditor(comp);
        });
      });

      host.querySelectorAll("[data-bow-comp-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.bowCompDel;
          if (!confirm("Delete this competency?\n\nThis cannot be undone.")) return;
          await deleteCompetency(id);
        });
      });

      host.querySelectorAll("[data-bow-comp-copy]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.bowCompCopy;
          const comp = BOW_VIEWER_STATE.competencies.find(c => c.id === id);
          if (comp && navigator.clipboard) {
            navigator.clipboard.writeText(comp.text).then(() => {
              toast("✓ Copied to clipboard", "success");
            });
          }
        });
      });
    }

    function renderBoWCompetencyRow(c, isStaff) {
      const recurring = c.isRecurring
        ? `<span class="bow-comp-recurring" title="Recurring competency">*</span>`
        : "";

      return `
        <div class="bow-comp-row">
          <div class="bow-comp-main">
            <span class="bow-comp-code">${esc(c.code || "")}${recurring}</span>
            <div class="bow-comp-text">${esc(c.text)}</div>
          </div>
          ${isStaff ? `
            <div class="bow-comp-actions">
              <button class="copy" data-bow-comp-copy="${esc(c.id)}" title="Copy text">📋</button>
              <button class="edit" data-bow-comp-edit="${esc(c.id)}" title="Edit">✏️</button>
              <button class="del" data-bow-comp-del="${esc(c.id)}" title="Delete">🗑️</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    // ------------------------------------------------------------
    // Filter wiring
    // ------------------------------------------------------------
    function wireBoWFilters(comps) {
      const search = document.getElementById("bowSearch");
      const topicSel = document.getElementById("bowTopicFilter");
      const recurring = document.getElementById("bowRecurringFilter");

      if (search) {
        search.addEventListener("input", () => {
          BOW_VIEWER_STATE.filter.search = search.value.trim();
          renderBoWTopics(comps);
        });
      }
      if (topicSel) {
        topicSel.addEventListener("change", () => {
          BOW_VIEWER_STATE.filter.topic = topicSel.value;
          renderBoWTopics(comps);
        });
      }
      if (recurring) {
        recurring.addEventListener("change", () => {
          BOW_VIEWER_STATE.filter.recurringOnly = recurring.checked;
          renderBoWTopics(comps);
        });
      }
    }

    // ------------------------------------------------------------
    // Viewer: main handler attachment
    // ------------------------------------------------------------
    function attachBoWViewerHandlers(modal) {
      // Close
      modal.querySelectorAll("[data-close-bow-viewer]").forEach(b => {
        b.addEventListener("click", closeBoWViewer);
      });

      // Re-upload
      modal.querySelectorAll("[data-bow-reupload]").forEach(b => {
        b.addEventListener("click", () => {
          const { subjectCode } = BOW_VIEWER_STATE;
          const subj = getAllSubjectRecords().find(s => s.code === subjectCode);
          closeBoWViewer();
          openBoWUploadModal(subjectCode, subj?.displayName || subjectCode);
        });
      });

      // Add competency
      modal.querySelectorAll("[data-bow-add]").forEach(b => {
        b.addEventListener("click", () => {
          openCompetencyEditor(null);
        });
      });

      // Edit standards
      modal.querySelectorAll("[data-edit-standard]").forEach(b => {
        b.addEventListener("click", () => {
          const which = b.dataset.editStandard;
          editStandard(which);
        });
      });
    }

    // ------------------------------------------------------------
    // Competency editor (add/edit)
    // ------------------------------------------------------------
    function openCompetencyEditor(existing) {
      const isNew = !existing;
      const { subjectCode, term, competencies } = BOW_VIEWER_STATE;

      // Get unique topics for dropdown
      const topics = [...new Set(competencies.map(c => c.topicLabel))].filter(Boolean);
      const currentTopic = existing?.topicLabel || topics[0] || "1. General";

      // Build modal
      const modal = document.createElement("div");
      modal.className = "modal show";
      modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 48px rgba(0,0,0,.25);">
          <div style="padding:18px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <h3 style="margin:0;font-size:1.05rem;color:#0f2b4f;">
              ${isNew ? "➕ Add Competency" : "✏️ Edit Competency"}
            </h3>
            <button class="ac-btn outline small" data-close>✕</button>
          </div>
          <div style="padding:20px 22px;">
            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">Topic</label>
              <input id="edc-topic" type="text" list="edc-topic-list" value="${esc(currentTopic)}"
                     style="width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;" />
              <datalist id="edc-topic-list">
                ${topics.map(t => `<option value="${esc(t)}"></option>`).join("")}
              </datalist>
              <div style="font-size:11px;color:#6b7280;margin-top:4px;">Pick an existing topic or type a new one.</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
              <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">Code</label>
                <input id="edc-code" type="text" value="${esc(existing?.code || "")}"
                       style="width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:monospace;" />
              </div>
              <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">Duration (days)</label>
                <input id="edc-days" type="number" value="${existing?.durationDays || 5}" min="1"
                       style="width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;" />
              </div>
            </div>
            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">Competency Text</label>
              <textarea id="edc-text" rows="5"
                        style="width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;"
                        placeholder="e.g., Express oneself through music, arts, and movement">${esc(existing?.text || "")}</textarea>
            </div>
            <div>
              <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#374151;cursor:pointer;">
                <input id="edc-recurring" type="checkbox" ${existing?.isRecurring ? "checked" : ""} />
                🔁 Recurring competency (integrated across terms)
              </label>
            </div>
          </div>
          <div style="padding:14px 22px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;">
            <button class="ac-btn outline" data-close>Cancel</button>
            <button class="ac-btn success" data-save>💾 Save</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // Close
      modal.querySelectorAll("[data-close]").forEach(b => {
        b.addEventListener("click", () => modal.remove());
      });
      modal.addEventListener("click", e => {
        if (e.target === modal) modal.remove();
      });

      // Save
      modal.querySelector("[data-save]").addEventListener("click", async () => {
        const topicLabel = document.getElementById("edc-topic").value.trim();
        const code = document.getElementById("edc-code").value.trim();
        const text = document.getElementById("edc-text").value.trim();
        const days = parseInt(document.getElementById("edc-days").value, 10) || 5;
        const isRecurring = document.getElementById("edc-recurring").checked;

        if (!text) {
          toast("⚠️ Competency text is required", "error");
          return;
        }

        const btn = modal.querySelector("[data-save]");
        btn.disabled = true;
        btn.textContent = "Saving...";

        try {
          if (isNew) {
            await window.BoW.addCompetency(subjectCode, term, {
              topicLabel,
              code: code || autoGenerateCode(topicLabel),
              text,
              durationDays: days,
              isRecurring,
            });
            toast("✓ Competency added", "success");
          } else {
            await window.BoW.updateCompetency(subjectCode, term, existing.id, {
              topicLabel,
              code,
              text,
              durationDays: days,
              isRecurring,
            });
            toast("✓ Competency updated", "success");
          }

          modal.remove();
          await refreshBoWViewer();
        } catch (e) {
          console.error(e);
          toast("⚠️ " + (e.message || "Save failed"), "error");
          btn.disabled = false;
          btn.textContent = "💾 Save";
        }
      });
    }

    function autoGenerateCode(topicLabel) {
      const { term } = BOW_VIEWER_STATE;
      const idx = (BOW_VIEWER_STATE.competencies.length + 1).toString().padStart(3, "0");
      return `T${term}-NEW-${idx}`;
    }

    // ------------------------------------------------------------
    // Delete competency
    // ------------------------------------------------------------
    async function deleteCompetency(compId) {
      const { subjectCode, term } = BOW_VIEWER_STATE;
      try {
        await window.BoW.deleteCompetency(subjectCode, term, compId);
        toast("✓ Deleted", "success");
        await refreshBoWViewer();
      } catch (e) {
        console.error(e);
        toast("⚠️ " + (e.message || "Delete failed"), "error");
      }
    }

    // ------------------------------------------------------------
    // Edit standard (Content / Performance)
    // ------------------------------------------------------------
    function editStandard(which) {
      const { subjectCode, term, data } = BOW_VIEWER_STATE;
      const field = which === "content" ? "contentStandard" : "performanceStandard";
      const label = which === "content" ? "Content Standard" : "Performance Standard";
      const value = data[field] || "";

      const modal = document.createElement("div");
      modal.className = "modal show";
      modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:12px;max-width:640px;width:100%;box-shadow:0 24px 48px rgba(0,0,0,.25);">
          <div style="padding:18px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <h3 style="margin:0;font-size:1.05rem;color:#0f2b4f;">✏️ Edit ${label}</h3>
            <button class="ac-btn outline small" data-close>✕</button>
          </div>
          <div style="padding:20px 22px;">
            <textarea id="eds-value" rows="8"
                      style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;"
                      >${esc(value)}</textarea>
          </div>
          <div style="padding:14px 22px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;">
            <button class="ac-btn outline" data-close>Cancel</button>
            <button class="ac-btn success" data-save>💾 Save</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => modal.remove()));
      modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });

      modal.querySelector("[data-save]").addEventListener("click", async () => {
        const newValue = document.getElementById("eds-value").value.trim();
        try {
          await window.BoW.updateTermMeta(subjectCode, term, { [field]: newValue });
          toast(`✓ ${label} updated`, "success");
          modal.remove();
          await refreshBoWViewer();
        } catch (e) {
          toast("⚠️ " + (e.message || "Update failed"), "error");
        }
      });
    }

    // ------------------------------------------------------------
    // Refresh viewer (after edits)
    // ------------------------------------------------------------
    async function refreshBoWViewer() {
      const { subjectCode, term } = BOW_VIEWER_STATE;
      if (!subjectCode) return;

      try {
        const termDoc = await window.BoW.getBoWTerm(subjectCode, term);
        const comps = await window.BoW.listCompetencies(subjectCode, term);
        BOW_VIEWER_STATE.data = termDoc;
        BOW_VIEWER_STATE.competencies = comps;

        const modal = document.getElementById("bowViewerModal");
        const subject = getAllSubjectRecords().find(s => s.code === subjectCode);
        const subjectName = subject?.displayName || subjectCode;

        modal.querySelector(".bow-modal-head").innerHTML = renderBoWViewerHead(subjectName, termDoc, term);
        modal.querySelector(".bow-modal-body").innerHTML = renderBoWViewerBody(termDoc, comps);
        attachBoWViewerHandlers(modal);

        // Refresh count in table
        await loadBoWCounts();
        renderSubjectList();
      } catch (e) {
        console.error("[bow-viewer] refresh failed:", e);
      }
    }
  </script>

  <!-- ============ PDF.js (loaded AFTER the module, but doesn't matter here) ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>

</body>
</html>
