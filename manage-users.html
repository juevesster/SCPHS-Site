<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users — SCPHS</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; margin: 0; }

    /* ============ MAIN HEADER ============ */
    .mu-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; padding: 24px 0; }
    .mu-header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .mu-header a { color: #fff; text-decoration: none; opacity: 0.85; font-size: 0.85rem; }
    .mu-header a:hover { opacity: 1; }
    .mu-header h1 { margin: 6px 0 4px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mu-header h1 .pending-badge { background: #f59e0b; color: #fff; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; animation: pulseBadge 1.6s infinite; }
    @keyframes pulseBadge { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); } 50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } }
    .mu-header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }

    .mu-container { max-width: 1100px; margin: 0 auto; padding: 24px; }

    /* ============ PENDING APPROVALS QUEUE ============ */
    .mu-pending-panel { background: linear-gradient(135deg, #fef3c7, #fde68a); border: 1px solid #fcd34d; border-left: 5px solid #f59e0b; border-radius: 14px; padding: 20px 22px; margin-bottom: 24px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15); display: none; }
    .mu-pending-panel.has-items { display: block; }
    .mu-pending-panel.empty { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #86efac; border-left-color: #16a34a; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1); }
    .mu-pending-panel.empty .pending-title-icon { background: #16a34a; }

    .mu-pending-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .mu-pending-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; color: #78350f; }
    .mu-pending-panel.empty .mu-pending-title { color: #166534; }
    .mu-pending-title-icon { width: 34px; height: 34px; border-radius: 50%; background: #f59e0b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; }
    .mu-pending-count { background: #fff; color: #92400e; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 999px; border: 1px solid #fcd34d; margin-left: 6px; }
    .mu-pending-panel.empty .mu-pending-count { color: #166534; border-color: #86efac; }

    /* Pending user cards */
    .mu-pending-list { display: flex; flex-direction: column; gap: 10px; }
    .mu-pending-card { background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: flex-start; transition: all .15s; }
    .mu-pending-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(245, 158, 11, 0.12); }
    .mu-pending-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
    .mu-pending-body { min-width: 0; }
    .mu-pending-name { margin: 0 0 2px; font-size: 15px; font-weight: 800; color: #0f2b4f; }
    .mu-pending-email { margin: 0 0 6px; font-size: 12.5px; color: #6b7280; font-family: monospace; }
    .mu-pending-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: #6b7280; margin-top: 4px; }
    .mu-pending-meta .tag { background: #f3f4f6; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .mu-pending-meta .tag.role { background: #dbeafe; color: #1e40af; }
    .mu-pending-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .mu-pending-actions .mu-btn { font-size: 12px; padding: 7px 12px; justify-content: center; white-space: nowrap; }

    /* ============ TOOLBAR ============ */
    .mu-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .mu-search { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    .mu-search:focus { border-color: #1e6bb8; box-shadow: 0 0 0 3px rgba(30,107,184,.15); }
    .mu-select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; }

    .mu-btn { padding: 10px 16px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .mu-btn.primary { background: #1e3c72; color: #fff; }
    .mu-btn.primary:hover { background: #2a5298; }
    .mu-btn.outline { background: #fff; border-color: #d1d5db; color: #1e3c72; }
    .mu-btn.outline:hover { background: #f3f6fa; border-color: #1e6bb8; }
    .mu-btn.danger { background: #fff; color: #b91c1c; border-color: #fecaca; }
    .mu-btn.danger:hover { background: #fef2f2; border-color: #b91c1c; }
    .mu-btn.guest { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .mu-btn.success { background: #059669; color: #fff; border-color: #059669; }

    /* ============ USER CARDS ============ */
    .mu-user-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .mu-user-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #f3f4f6; }
    .mu-user-name { margin: 0 0 2px; font-size: 1.1rem; color: #0f2b4f; font-weight: 700; }
    .mu-user-email { margin: 0; font-size: 0.85rem; color: #6b7280; font-family: monospace; }

    .mu-field-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .mu-field-row label { font-size: 0.78rem; font-weight: 700; color: #374151; text-transform: uppercase; padding-top: 10px; }
    .mu-field-row select, .mu-field-row input[type="text"] { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; width: 100%; max-width: 400px; }
    
    .mu-checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
    .mu-checkbox { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafbfc; cursor: pointer; font-size: 0.85rem; }
    .mu-checkbox.checked { background: #eff6ff; border-color: #1e6bb8; }

    .mu-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f3f4f6; flex-wrap: wrap; }
    .mu-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #eff6ff; color: #1e40af; margin-left: 6px; }

    .mu-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; transition: all .2s; z-index: 9999; pointer-events: none; }
    .mu-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .mu-toast.error { background: #b91c1c; }
    .mu-toast.success { background: #059669; }

    .mu-loading, .mu-empty { text-align: center; padding: 60px 20px; color: #6b7280; }
    .mu-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #1e3c72; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) { .mu-field-row { grid-template-columns: 1fr; } .mu-pending-card { grid-template-columns: 1fr; } .mu-pending-avatar { display: none; } }
  </style>
</head>
<body>

  <header class="mu-header">
    <div class="mu-header-inner">
      <a href="index.html">← Back to Portal</a>
      <h1 id="muTitle">👥 Manage Users</h1>
      <p id="muSubtitle">Assign roles and permissions to staff, students, and guest teachers</p>
    </div>
  </header>

  <div class="mu-container" id="main-content">
    <div class="mu-loading" id="loading">
      <div class="mu-spinner"></div>
      <div>Loading users…</div>
    </div>

    <div id="content" style="display:none;">
      <!-- PENDING APPROVALS QUEUE -->
      <div class="mu-pending-panel" id="pendingPanel">
        <div class="mu-pending-head">
          <div>
            <div class="mu-pending-title">
              <span class="mu-pending-title-icon" id="pendingIcon">⏳</span>
              <span id="pendingTitleText">Pending Approvals</span>
              <span class="mu-pending-count" id="pendingCount">0</span>
            </div>
            <div class="mu-pending-sub" id="pendingSubtitle">These users are waiting for approval.</div>
          </div>
          <button class="mu-btn outline" id="pendingRefresh" style="font-size:12px;padding:6px 12px;">🔄 Refresh</button>
        </div>
        <div class="mu-pending-list" id="pendingList"></div>
      </div>

      <!-- TOOLBAR -->
      <div class="mu-toolbar">
        <input type="search" id="searchInput" class="mu-search" placeholder="🔍 Search by name or email…" />
        <select id="roleFilter" class="mu-select">
          <option value="">All roles</option>
          <option value="pending">⏳ Pending approval</option>
          <option value="student">Students</option>
          <option value="teacher">Teachers</option>
          <option value="admin">Admins</option>
        </select>
        <span id="userCount" style="font-size:0.85rem;color:#6b7280;margin-left:auto;"></span>
      </div>

      <div id="userList"></div>
    </div>
  </div>

  <div id="toast" class="mu-toast"></div>

  <script type="module">
    import { auth, db } from "./assets/js/firebase-config.js";
    import { collection, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { SUPER_ADMINS, getCurrentUserProfile } from "./assets/js/roles.js";

    const $ = id => document.getElementById(id);
    let CURRENT_ADMIN = null;
    let ALL_USERS = [];
    let REFRESH_TIMER = null;

    let toastTimer;
    function toast(msg, type = "") {
      const t = $("toast");
      t.textContent = msg;
      t.className = "mu-toast show" + (type ? " " + type : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = "mu-toast", 3000);
    }

    function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace("login.html"); return; }
      CURRENT_ADMIN = await getCurrentUserProfile();
      const isAdmin = CURRENT_ADMIN?.primaryRole === "admin" || CURRENT_ADMIN?.isSuperAdmin || CURRENT_ADMIN?.permissions?.canManageUsers === true;
      if (!isAdmin) { $("loading").innerHTML = `<h2 style="color:red;">Access Denied</h2>`; return; }
      await loadUsers();
      startAutoRefresh();
    });

    async function loadUsers() {
      try {
        const snap = await getDocs(collection(db, "users"));
        ALL_USERS = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
        ALL_USERS.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        $("loading").style.display = "none";
        $("content").style.display = "block";
        renderPendingQueue();
        renderUsers();
        updateHeaderBadge();
      } catch (e) { $("loading").innerHTML = `<div style="color:red;">Failed: ${esc(e.message)}</div>`; }
    }

    function startAutoRefresh() {
      if (REFRESH_TIMER) clearInterval(REFRESH_TIMER);
      REFRESH_TIMER = setInterval(() => loadUsers(), 45000);
    }

    function isPending(user) {
      return user.pendingApproval === true || user.requestingAccess === true;
    }

    function getPendingUsers() {
      return ALL_USERS.filter(u => isPending(u)).sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    }

    function updateHeaderBadge() {
      const count = getPendingUsers().length;
      const titleEl = $("muTitle");
      let badge = titleEl.querySelector(".pending-badge");
      if (count > 0) {
        if (!badge) { badge = document.createElement("span"); badge.className = "pending-badge"; titleEl.appendChild(badge); }
        badge.textContent = `⏳ ${count} waiting`;
        document.title = `(${count}) Manage Users — SCPHS`;
      } else {
        if (badge) badge.remove();
        document.title = "Manage Users — SCPHS";
      }
    }

    function renderPendingQueue() {
      const panel = $("pendingPanel");
      const list = $("pendingList");
      const pending = getPendingUsers();
      
      $("pendingCount").textContent = pending.length;

      if (pending.length === 0) {
        panel.classList.add("empty");
        $("pendingIcon").textContent = "✓";
        $("pendingTitleText").textContent = "All Caught Up";
        $("pendingSubtitle").textContent = "No pending approvals right now.";
        list.innerHTML = "";
        return;
      }

      panel.classList.remove("empty");
      $("pendingIcon").textContent = "⏳";
      $("pendingTitleText").textContent = "Pending Approvals";
      $("pendingSubtitle").textContent = `${pending.length} user(s) waiting for approval.`;
      list.innerHTML = pending.map(u => renderPendingCard(u)).join("");

      list.querySelectorAll("[data-pending-action]").forEach(btn => {
        btn.addEventListener("click", () => handlePendingAction(btn));
      });
    }

    function renderPendingCard(u) {
      const initial = (u.name || u.email || "?").trim().charAt(0).toUpperCase();
      return `
        <div class="mu-pending-card">
          <div class="mu-pending-avatar">${esc(initial)}</div>
          <div class="mu-pending-body">
            <h4 class="mu-pending-name">${esc(u.name || "Unnamed")}</h4>
            <p class="mu-pending-email">${esc(u.email || "")}</p>
            <div class="mu-pending-meta"><span class="tag">🕒 Just now</span></div>
          </div>
          <div class="mu-pending-actions">
            <button class="mu-btn success" data-pending-action="approve-scphs" data-uid="${u.uid}">🏫 Teacher</button>
            <button class="mu-btn guest" data-pending-action="approve-guest" data-uid="${u.uid}">🌐 Guest</button>
            <button class="mu-btn primary" data-pending-action="approve-student" data-uid="${u.uid}">🎓 Student</button>
            <button class="mu-btn danger" data-pending-action="decline" data-uid="${u.uid}">🚫 Decline</button>
          </div>
        </div>
      `;
    }

    async function handlePendingAction(btn) {
      const action = btn.dataset.pendingAction;
      const uid = btn.dataset.uid;
      const user = ALL_USERS.find(u => u.uid === uid);
      if (!user) return;

      const name = user.name || user.email;
      const confirmMessages = {
        "approve-scphs": `Approve ${name} as SCPHS Teacher?`,
        "approve-guest": `Approve ${name} as Guest Teacher?`,
        "approve-student": `Approve ${name} as Student?`,
        "decline": `Decline ${name}'s request?`
      };
      if (!confirm(confirmMessages[action])) return;

      btn.disabled = true;
      btn.textContent = "⏳...";

      try {
        const payload = { updatedAt: serverTimestamp(), approvedAt: serverTimestamp(), pendingApproval: false, requestingAccess: false };
        
        if (action === "approve-scphs") { payload.primaryRole = "teacher"; payload.teacherType = "scphs"; }
        else if (action === "approve-guest") { payload.primaryRole = "teacher"; payload.teacherType = "external"; }
        else if (action === "approve-student") { payload.primaryRole = "student"; }
        else if (action === "decline") { payload.primaryRole = "declined"; }

        await updateDoc(doc(db, "users", uid), payload);
        toast("✓ Action completed successfully", "success");
        await loadUsers();
      } catch (e) {
        toast("⚠️ " + e.message, "error");
        btn.disabled = false;
      }
    }

    function renderUsers() {
      const term = ($("searchInput")?.value || "").toLowerCase().trim();
      const filter = $("roleFilter")?.value || "";

      const filtered = ALL_USERS.filter(u => {
        const role = u.primaryRole || u.role || "student";
        const matchTerm = !term || (u.name || "").toLowerCase().includes(term) || (u.email || "").toLowerCase().includes(term);
        
        let matchRole = true;
        if (filter === "pending") matchRole = isPending(u);
        else if (filter) matchRole = role === filter;

        return matchTerm && matchRole;
      });

      $("userCount").textContent = `${filtered.length} users`;
      const host = $("userList");
      
      if (!filtered.length) {
        host.innerHTML = `<div class="mu-empty">No users found.</div>`;
        return;
      }

      // Simplified user cards for the main list
      host.innerHTML = filtered.map(u => {
        const role = u.primaryRole || u.role || "student";
        return `
          <div class="mu-user-card">
            <div class="mu-user-header">
              <div>
                <h3 class="mu-user-name">${esc(u.name || "Unnamed")} <span class="mu-badge">${esc(role)}</span></h3>
                <p class="mu-user-email">${esc(u.email || "")}</p>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    $("searchInput")?.addEventListener("input", renderUsers);
    $("roleFilter")?.addEventListener("change", renderUsers);
    $("pendingRefresh")?.addEventListener("click", () => loadUsers());
    window.addEventListener("focus", () => loadUsers());
  </script>
</body>
</html>
