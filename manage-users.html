<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users — SCPHS</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; margin: 0; }

    /* ============ MAIN HEADER ============ */
    .mu-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; padding: 24px 0; }
    .mu-header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .mu-header a { color: #fff; text-decoration: none; opacity: 0.85; font-size: 0.85rem; }
    .mu-header a:hover { opacity: 1; }
    .mu-header h1 { margin: 6px 0 4px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mu-header h1 .pending-badge { background: #f59e0b; color: #fff; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; animation: pulseBadge 1.6s ease-in-out infinite; }
    @keyframes pulseBadge { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); } 50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } }
    .mu-header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }

    .mu-container { max-width: 1100px; margin: 0 auto; padding: 24px; }

    /* ============ PENDING APPROVALS QUEUE ============ */
    .mu-pending-panel { background: linear-gradient(135deg, #fef3c7, #fde68a); border: 1px solid #fcd34d; border-left: 5px solid #f59e0b; border-radius: 14px; padding: 20px 22px; margin-bottom: 24px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15); display: none; }
    .mu-pending-panel.has-items { display: block; }
    .mu-pending-panel.empty { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #86efac; border-left-color: #16a34a; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1); }
    .mu-pending-panel.empty .pending-title-icon { background: #16a34a; }

    .mu-pending-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .mu-pending-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; color: #78350f; letter-spacing: 0.02em; }
    .mu-pending-panel.empty .mu-pending-title { color: #166534; }
    .mu-pending-title-icon { width: 34px; height: 34px; border-radius: 50%; background: #f59e0b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); }
    .mu-pending-sub { font-size: 12px; color: #92400e; font-weight: 500; }
    .mu-pending-panel.empty .mu-pending-sub { color: #15803d; }
    .mu-pending-count { background: #fff; color: #92400e; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 999px; border: 1px solid #fcd34d; margin-left: 6px; }
    .mu-pending-panel.empty .mu-pending-count { color: #166534; border-color: #86efac; }

    /* Pending user cards */
    .mu-pending-list { display: flex; flex-direction: column; gap: 10px; }
    .mu-pending-card { background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: flex-start; transition: all .15s; }
    .mu-pending-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(245, 158, 11, 0.12); }
    .mu-pending-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; flex-shrink: 0; }
    .mu-pending-body { min-width: 0; }
    .mu-pending-name { margin: 0 0 2px; font-size: 15px; font-weight: 800; color: #0f2b4f; }
    .mu-pending-email { margin: 0 0 6px; font-size: 12.5px; color: #6b7280; font-family: monospace; word-break: break-all; }
    .mu-pending-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: #6b7280; margin-top: 4px; }
    .mu-pending-meta .tag { background: #f3f4f6; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .mu-pending-meta .tag.role { background: #dbeafe; color: #1e40af; }
    .mu-pending-message { background: #fef9c3; border-left: 3px solid #f59e0b; padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 12.5px; color: #78350f; margin-top: 8px; font-style: italic; }
    .mu-pending-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .mu-pending-actions .mu-btn { font-size: 12px; padding: 7px 12px; justify-content: center; white-space: nowrap; }

    /* ============ TOOLBAR ============ */
    .mu-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .mu-search { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
    .mu-search:focus { border-color: #1e6bb8; box-shadow: 0 0 0 3px rgba(30,107,184,.15); }
    .mu-select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; cursor: pointer; }

    .mu-btn { padding: 10px 16px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .mu-btn.primary { background: #1e3c72; color: #fff; }
    .mu-btn.primary:hover { background: #2a5298; }
    .mu-btn.outline { background: #fff; border-color: #d1d5db; color: #1e3c72; }
    .mu-btn.outline:hover { background: #f3f6fa; border-color: #1e6bb8; }
    .mu-btn.danger { background: #fff; color: #b91c1c; border-color: #fecaca; }
    .mu-btn.danger:hover { background: #fef2f2; border-color: #b91c1c; }
    .mu-btn.guest { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .mu-btn.guest:hover { background: #6d28d9; }
    .mu-btn.success { background: #059669; color: #fff; border-color: #059669; }
    .mu-btn.success:hover { background: #047857; }
    .mu-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ============ USER CARDS ============ */
    .mu-user-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .mu-user-card.hidden { display: none; }
    .mu-user-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid #f3f4f6; }
    .mu-user-name { margin: 0 0 2px; font-size: 1.1rem; color: #0f2b4f; font-weight: 700; }
    .mu-user-email { margin: 0; font-size: 0.85rem; color: #6b7280; font-family: monospace; }

    .mu-field-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .mu-field-row label { font-size: 0.78rem; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.02em; padding-top: 10px; }
    .mu-field-row select, .mu-field-row input[type="text"] { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; font-family: inherit; width: 100%; max-width: 400px; }
    .mu-field-row select:focus, .mu-field-row input[type="text"]:focus { outline: none; border-color: #1e6bb8; box-shadow: 0 0 0 3px rgba(30,107,184,.12); }

    .mu-hint { font-size: 0.72rem; color: #6b7280; margin-top: 4px; }

    .mu-teacher-type { display: flex; flex-direction: column; gap: 8px; max-width: 500px; }
    .mu-teacher-type label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafbfc; cursor: pointer; font-size: 0.85rem; transition: all .15s; }
    .mu-teacher-type label:hover { background: #eff6ff; border-color: #bfdbfe; }
    .mu-teacher-type label.selected { background: #eff6ff; border-color: #1e6bb8; }
    .mu-teacher-type input[type="radio"] { margin-top: 3px; accent-color: #1e3c72; }
    .mu-teacher-type .tt-title { font-weight: 700; color: #0f2b4f; }
    .mu-teacher-type .tt-desc  { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }

    .mu-checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
    .mu-checkbox { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafbfc; cursor: pointer; font-size: 0.85rem; transition: all .15s; user-select: none; }
    .mu-checkbox:hover { background: #eff6ff; border-color: #bfdbfe; }
    .mu-checkbox input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: #1e3c72; }
    .mu-checkbox.checked { background: #eff6ff; border-color: #1e6bb8; }

    .mu-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f3f4f6; flex-wrap: wrap; }

    /* ============ STATUS BADGES ============ */
    .mu-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.03em;}
    
    /* Dynamic Approval Statuses */
    .status-approved { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .status-disapproved { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    
    /* Role Badges */
    .mu-badge.super-admin { background: #fef3c7; color: #92400e; }
    .mu-badge.guest-teacher { background: #ede9fe; color: #6d28d9; }
    .mu-badge.scphs-teacher { background: #dbeafe; color: #1e40af; }

    .mu-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; transition: all .2s; z-index: 9999; pointer-events: none; }
    .mu-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .mu-toast.error { background: #b91c1c; }
    .mu-toast.success { background: #059669; }

    .mu-loading, .mu-empty { text-align: center; padding: 60px 20px; color: #6b7280; }
    .mu-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #1e3c72; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) { .mu-field-row { grid-template-columns: 1fr; gap: 4px; } .mu-field-row label { font-size: 0.72rem; padding-top: 0; } .mu-pending-card { grid-template-columns: 1fr; } .mu-pending-avatar { display: none; } .mu-pending-actions { flex-direction: row; flex-wrap: wrap; margin-top: 8px; } }
  </style>
</head>
<body>

  <header class="mu-header">
    <div class="mu-header-inner">
      <a href="index.html">← Back to Portal</a>
      <h1 id="muTitle">👥 Manage Users</h1>
      <p id="muSubtitle">Assign roles and permissions to staff, students, and guest teachers</p>
    </div>
  </header>

  <div class="mu-container" id="main-content">

    <div class="mu-loading" id="loading">
      <div class="mu-spinner"></div>
      <div>Loading users…</div>
    </div>

    <div id="content" style="display:none;">

      <!-- ============ PENDING APPROVALS QUEUE ============ -->
      <div class="mu-pending-panel" id="pendingPanel">
        <div class="mu-pending-head">
          <div>
            <div class="mu-pending-title">
              <span class="mu-pending-title-icon" id="pendingIcon">⏳</span>
              <span id="pendingTitleText">Pending Approvals</span>
              <span class="mu-pending-count" id="pendingCount">0</span>
            </div>
            <div class="mu-pending-sub" id="pendingSubtitle">
              These users are waiting for approval.
            </div>
          </div>
          <button class="mu-btn outline" id="pendingRefresh" style="font-size:12px;padding:6px 12px;">🔄 Refresh</button>
        </div>
        <div class="mu-pending-list" id="pendingList"></div>
      </div>

      <!-- ============ TOOLBAR ============ -->
      <div class="mu-toolbar">
        <input type="search" id="searchInput" class="mu-search" placeholder="🔍 Search by name or email…" />
        <select id="roleFilter" class="mu-select">
          <option value="">All roles</option>
          <option value="pending">⏳ Pending approval</option>
          <option value="student">Students</option>
          <option value="teacher">Teachers (all)</option>
          <option value="scphs-teacher">🏫 SCPHS Teachers</option>
          <option value="guest-teacher">🌐 Guest Teachers</option>
          <option value="admin">Admins</option>
          <option value="declined">🚫 Disapproved</option>
        </select>
        <span id="userCount" style="font-size:0.85rem;color:#6b7280;margin-left:auto;"></span>
      </div>

      <div id="userList"></div>
    </div>
  </div>

  <div id="toast" class="mu-toast"></div>

  <script type="module">
    import { auth, db } from "./assets/js/firebase-config.js";
    import { collection, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { SUPER_ADMINS, PERMISSION_TEMPLATES, getCurrentUserProfile } from "./assets/js/roles.js";

    const $ = id => document.getElementById(id);
    let CURRENT_ADMIN = null;
    let ALL_USERS = [];
    let REFRESH_TIMER = null;

    let toastTimer;
    function toast(msg, type = "") {
      const t = $("toast");
      t.textContent = msg;
      t.className = "mu-toast show" + (type ? " " + type : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = "mu-toast", 3000);
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace("login.html"); return; }
      CURRENT_ADMIN = await getCurrentUserProfile();
      const isAdmin = CURRENT_ADMIN?.primaryRole === "admin" || CURRENT_ADMIN?.isSuperAdmin || CURRENT_ADMIN?.permissions?.canManageUsers === true;
      if (!isAdmin) { $("loading").innerHTML = `<h2 style="color:#b91c1c;">🚫 Access Denied</h2>`; return; }
      await loadUsers();
      startAutoRefresh();
    });

    async function loadUsers() {
      try {
        const snap = await getDocs(collection(db, "users"));
        ALL_USERS = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
        ALL_USERS.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        $("loading").style.display = "none";
        $("content").style.display = "block";
        renderPendingQueue();
        renderUsers();
        updateHeaderBadge();
      } catch (e) {
        $("loading").innerHTML = `<div style="color:#b91c1c;">Failed to load users: ${esc(e.message)}</div>`;
      }
    }

    function startAutoRefresh() {
      if (REFRESH_TIMER) clearInterval(REFRESH_TIMER);
      REFRESH_TIMER = setInterval(() => loadUsers(), 45000);
    }

    // ============================================================
    // DYNAMIC STATUS LOGIC
    // ============================================================
    function getApprovalStatus(user) {
      if (user.primaryRole === "declined") return "disapproved";
      if (user.pendingApproval === true || user.requestingAccess === true) return "pending";
      return "approved";
    }

    function isPending(user) {
      return getApprovalStatus(user) === "pending";
    }

    function getPendingUsers() {
      return ALL_USERS.filter(u => isPending(u)).sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    }

    function timeAgo(ts) {
      if (!ts) return "just now";
      const date = ts.toDate ? ts.toDate() : new Date(ts);
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
      if (seconds < 60) return "just now";
      const mins = Math.floor(seconds / 60);
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days}d ago`;
      return date.toLocaleDateString();
    }

    function updateHeaderBadge() {
      const count = getPendingUsers().length;
      const titleEl = $("muTitle");
      let badge = titleEl.querySelector(".pending-badge");
      if (count > 0) {
        if (!badge) { badge = document.createElement("span"); badge.className = "pending-badge"; titleEl.appendChild(badge); }
        badge.textContent = `⏳ ${count} waiting`;
        document.title = `(${count}) Manage Users — SCPHS`;
      } else {
        if (badge) badge.remove();
        document.title = "Manage Users — SCPHS";
      }
    }

    function renderPendingQueue() {
      const panel = $("pendingPanel");
      const list = $("pendingList");
      const pending = getPendingUsers();
      const count = pending.length;

      $("pendingCount").textContent = count;

      if (count === 0) {
        panel.classList.add("empty");
        $("pendingIcon").textContent = "✓";
        $("pendingTitleText").textContent = "All Caught Up";
        $("pendingSubtitle").textContent = "No pending approvals right now.";
        list.innerHTML = "";
        return;
      }

      panel.classList.remove("empty");
      $("pendingIcon").textContent = "⏳";
      $("pendingTitleText").textContent = "Pending Approvals";
      $("pendingSubtitle").textContent = `${count} user(s) waiting for approval.`;
      list.innerHTML = pending.map(u => renderPendingCard(u)).join("");

      list.querySelectorAll("[data-pending-action]").forEach(btn => {
        btn.addEventListener("click", () => handlePendingAction(btn));
      });
    }

    function renderPendingCard(u) {
      const initial = (u.name || u.email || "?").trim().charAt(0).toUpperCase();
      return `
        <div class="mu-pending-card" data-uid="${u.uid}">
          <div class="mu-pending-avatar">${esc(initial)}</div>
          <div class="mu-pending-body">
            <h4 class="mu-pending-name">${esc(u.name || "Unnamed")}</h4>
            <p class="mu-pending-email">${esc(u.email || "")}</p>
            <div class="mu-pending-meta"><span class="tag">⏳ ${timeAgo(u.createdAt)}</span></div>
          </div>
          <div class="mu-pending-actions">
            <button class="mu-btn success" data-pending-action="approve-scphs" data-uid="${u.uid}">🏫 Teacher</button>
            <button class="mu-btn guest" data-pending-action="approve-guest" data-uid="${u.uid}">🌐 Guest</button>
            <button class="mu-btn primary" data-pending-action="approve-student" data-uid="${u.uid}">🎓 Student</button>
            <button class="mu-btn danger" data-pending-action="decline" data-uid="${u.uid}">🚫 Disapprove</button>
          </div>
        </div>
      `;
    }

    async function handlePendingAction(btn) {
      const action = btn.dataset.pendingAction;
      const uid = btn.dataset.uid;
      const user = ALL_USERS.find(u => u.uid === uid);
      if (!user) return;

      const name = user.name || user.email;
      const confirmMessages = {
        "approve-scphs": `Accept ${name} as SCPHS Teacher?`,
        "approve-guest": `Accept ${name} as Guest Teacher?`,
        "approve-student": `Accept ${name} as Student?`,
        "decline": `Disapprove ${name}? They will not be able to log in.`
      };
      if (!confirm(confirmMessages[action])) return;

      btn.disabled = true;
      btn.textContent = "⏳...";

      try {
        const payload = { updatedAt: serverTimestamp(), approvedAt: serverTimestamp(), pendingApproval: false, requestingAccess: false };
        
        if (action === "approve-scphs") { payload.primaryRole = "teacher"; payload.teacherType = "scphs"; }
        else if (action === "approve-guest") { payload.primaryRole = "teacher"; payload.teacherType = "external"; }
        else if (action === "approve-student") { payload.primaryRole = "student"; }
        else if (action === "decline") { payload.primaryRole = "declined"; }

        await updateDoc(doc(db, "users", uid), payload);
        toast("✓ Status updated", "success");
        await loadUsers();
      } catch (e) {
        toast("⚠️ " + e.message, "error");
        btn.disabled = false;
      }
    }

    function renderUsers() {
      const term = ($("searchInput")?.value || "").toLowerCase().trim();
      const filter = $("roleFilter")?.value || "";

      const filtered = ALL_USERS.filter(u => {
        const primary = u.primaryRole || u.role || "student";
        const tType = String(u.teacherType || "").toLowerCase();
        const matchTerm = !term || (u.name || "").toLowerCase().includes(term) || (u.email || "").toLowerCase().includes(term);

        let matchRole = true;
        if (filter === "pending") { matchRole = isPending(u); }
        else if (filter === "scphs-teacher") { matchRole = primary === "teacher" && (tType === "scphs" || tType === "internal" || !tType); }
        else if (filter === "guest-teacher") { matchRole = primary === "teacher" && (tType === "external" || tType === "guest"); }
        else if (filter) { matchRole = primary === filter; }

        return matchTerm && matchRole;
      });

      $("userCount").textContent = `${filtered.length} users`;
      const host = $("userList");
      
      if (!filtered.length) { host.innerHTML = `<div class="mu-empty">No users found.</div>`; return; }

      host.innerHTML = filtered.map(user => renderUserCard(user)).join("");
      attachHandlers();
    }

    function renderUserCard(user) {
      const isSuper = SUPER_ADMINS.includes(user.email);
      const primaryRole = user.primaryRole || user.role || "student";
      const permissions = user.permissions || {};
      const secondaryRoles = Array.isArray(user.secondaryRoles) ? user.secondaryRoles : [];
      let teacherType = String(user.teacherType || "").toLowerCase();
      if (primaryRole === "teacher" && !teacherType) teacherType = "scphs";

      const isTeacher = primaryRole === "teacher";
      const status = getApprovalStatus(user);

      // 🆕 Dynamic Status Badge
      let statusBadge = "";
      if (status === "approved") statusBadge = `<span class="mu-badge status-approved">✅ Accepted</span>`;
      if (status === "pending") statusBadge = `<span class="mu-badge status-pending">⏳ Pending</span>`;
      if (status === "disapproved") statusBadge = `<span class="mu-badge status-disapproved">🚫 Disapproved</span>`;

      // Role Badge
      let roleBadge = "";
      if (isTeacher) {
        if (teacherType === "external") roleBadge = '<span class="mu-badge guest-teacher">🌐 Guest</span>';
        else roleBadge = '<span class="mu-badge scphs-teacher">🏫 SCPHS</span>';
      }

      const permissionList = [["canPostBulletin", "Post Bulletins"], ["canUploadMemo", "Upload Memos"], ["canManageClasses", "Manage Classes"], ["canEnterGrades", "Enter Grades"], ["canManageRoster", "Manage Class Roster"], ["canCreateExams", "Create Exams"], ["canManageUsers", "Manage Users"]];
      const permHTML = permissionList.map(([key, label]) => {
        const checked = permissions[key] === true;
        return `<label class="mu-checkbox${checked ? " checked" : ""}"><input type="checkbox" data-perm="${key}" ${checked ? "checked" : ""} ${isSuper ? "disabled" : ""}><span>${label}</span></label>`;
      }).join("");

      const secondaryHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${secondaryRoles.length ? secondaryRoles.map(r => `<span class="mu-badge" style="background:#f3f4f6;color:#374151;">${esc(r)}</span>`).join("") : '<span style="font-size:0.8rem;color:#9ca3af;">None</span>'}</div>`;

      const teacherTypeHTML = `
        <div class="mu-field-row" data-teacher-type-row style="${isTeacher ? "" : "display:none;"}">
          <label>Teacher Type</label>
          <div class="mu-teacher-type">
            <label class="${teacherType === "scphs" ? "selected" : ""}"><input type="radio" name="teacherType_${user.uid}" value="scphs" ${teacherType === "scphs" ? "checked" : ""} ${isSuper ? "disabled" : ""}><div><div class="tt-title">🏫 SCPHS Teacher</div><div class="tt-desc">Full access to ILAW Planner.</div></div></label>
            <label class="${teacherType === "external" ? "selected" : ""}"><input type="radio" name="teacherType_${user.uid}" value="external" ${teacherType === "external" ? "checked" : ""} ${isSuper ? "disabled" : ""}><div><div class="tt-title">🌐 Guest Teacher</div><div class="tt-desc">Open workspace access.</div></div></label>
          </div>
        </div>
      `;

      return `
        <div class="mu-user-card" data-uid="${user.uid}">
          <div class="mu-user-header">
            <div>
              <h3 class="mu-user-name">
                ${esc(user.name || "Unnamed")} 
                ${isSuper ? '<span class="mu-badge super-admin">👑 Super Admin</span>' : ''} 
                ${roleBadge}
                ${statusBadge}
              </h3>
              <p class="mu-user-email">${esc(user.email || "")}</p>
            </div>
          </div>

          <div class="mu-field-row">
            <label>Primary Role</label>
            <div>
              <select data-field="primaryRole" ${isSuper ? "disabled" : ""}>
                <option value="student" ${primaryRole === "student" ? "selected" : ""}>Student</option>
                <option value="teacher" ${primaryRole === "teacher" ? "selected" : ""}>Teacher</option>
                <option value="admin" ${primaryRole === "admin" ? "selected" : ""}>Admin</option>
                <option value="declined" ${primaryRole === "declined" ? "selected" : ""}>Disapproved (Blocked)</option>
              </select>
            </div>
          </div>

          ${teacherTypeHTML}

          <div class="mu-field-row">
            <label>Additional Roles</label>
            <div>
              <input type="text" data-field="secondaryRoles" value="${esc(secondaryRoles.join(", "))}" placeholder="e.g., SSLG President" ${isSuper ? "disabled" : ""}>
              ${secondaryHTML}
            </div>
          </div>

          <div class="mu-field-row" style="grid-template-columns:1fr;">
            <label style="margin-bottom:8px;">Permissions</label>
            <div class="mu-checkbox-group">${permHTML}</div>
          </div>

          <div class="mu-actions">
            <button class="mu-btn primary" data-action="save" ${isSuper ? "disabled" : ""}>💾 Save Changes</button>
            <button class="mu-btn outline" data-action="reset" ${isSuper ? "disabled" : ""}>↺ Reset</button>
            <button class="mu-btn outline" data-action="apply-teacher" ${isSuper ? "disabled" : ""}>🏫 Apply SCPHS Teacher</button>
            <button class="mu-btn outline" data-action="apply-adviser" ${isSuper ? "disabled" : ""}>📋 Apply Adviser</button>
          </div>
        </div>
      `;
    }

    function attachHandlers() {
      document.querySelectorAll(".mu-checkbox input[type='checkbox']").forEach(cb => {
        cb.addEventListener("change", () => cb.closest(".mu-checkbox").classList.toggle("checked", cb.checked));
      });

      document.querySelectorAll(".mu-user-card").forEach(card => {
        const uid = card.dataset.uid;
        
        const roleSel = card.querySelector("[data-field='primaryRole']");
        roleSel?.addEventListener("change", () => {
          const row = card.querySelector("[data-teacher-type-row]");
          if (row) row.style.display = roleSel.value === "teacher" ? "" : "none";
        });

        card.querySelectorAll("input[name^='teacherType_']").forEach(radio => {
          radio.addEventListener("change", () => {
            card.querySelectorAll(".mu-teacher-type label").forEach(lbl => lbl.classList.remove("selected"));
            radio.closest("label").classList.add("selected");
          });
        });

        card.querySelector("[data-action='save']")?.addEventListener("click", () => saveUser(card, uid));
        card.querySelector("[data-action='reset']")?.addEventListener("click", () => loadUsers());
        card.querySelector("[data-action='apply-teacher']")?.addEventListener("click", () => applyTemplate(card, "teacher", "scphs"));
        card.querySelector("[data-action='apply-adviser']")?.addEventListener("click", () => applyTemplate(card, "adviser"));
      });
    }

    async function saveUser(card, uid) {
      const primaryRole = card.querySelector("[data-field='primaryRole']").value;
      const secondaryRaw = card.querySelector("[data-field='secondaryRoles']").value;
      const secondaryRoles = secondaryRaw.split(",").map(s => s.trim()).filter(Boolean);
      
      const permissions = {};
      card.querySelectorAll("input[data-perm]").forEach(cb => { permissions[cb.dataset.perm] = cb.checked; });
      
      const teacherTypeRadio = card.querySelector("input[name^='teacherType_']:checked");
      const teacherType = teacherTypeRadio ? teacherTypeRadio.value : "";

      // If Admin manually sets role to "student" or "teacher", ensure they are approved
      const updatePayload = { primaryRole, secondaryRoles, permissions, updatedAt: serverTimestamp() };
      
      if (primaryRole === "declined") {
        updatePayload.pendingApproval = false;
      } else {
        updatePayload.pendingApproval = false; // Manually saving implies approval
      }

      if (primaryRole === "teacher" && teacherType) updatePayload.teacherType = teacherType;

      try {
        await updateDoc(doc(db, "users", uid), updatePayload);
        toast("✓ User updated successfully", "success");
        await loadUsers();
      } catch (e) {
        toast("⚠️ " + e.message, "error");
      }
    }

    function applyTemplate(card, templateKey, forcedTeacherType) {
      const template = PERMISSION_TEMPLATES[templateKey];
      if (!template) return;

      card.querySelector("[data-field='primaryRole']").value = template.primaryRole;

      Object.entries(template.permissions).forEach(([key, val]) => {
        const cb = card.querySelector(`input[data-perm='${key}']`);
        if (cb) { cb.checked = val; cb.closest(".mu-checkbox").classList.toggle("checked", val); }
      });

      if (template.primaryRole === "teacher") {
        const row = card.querySelector("[data-teacher-type-row]");
        if (row) row.style.display = "";
        const target = forcedTeacherType || "scphs";
        const radio = card.querySelector(`input[name^='teacherType_'][value='${target}']`);
        if (radio) { radio.checked = true; card.querySelectorAll(".mu-teacher-type label").forEach(l => l.classList.remove("selected")); radio.closest("label").classList.add("selected"); }
      }

      toast(`Applied template`, "success");
    }

    $("searchInput")?.addEventListener("input", renderUsers);
    $("roleFilter")?.addEventListener("change", renderUsers);
    $("pendingRefresh")?.addEventListener("click", () => loadUsers());
    window.addEventListener("focus", () => loadUsers());
  </script>
</body>
</html>
