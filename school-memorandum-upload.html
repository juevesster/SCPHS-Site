<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload School Memorandum</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body { max-width:600px; margin:40px auto; padding:20px; font-family:system-ui, sans-serif; }
  label { display:block; margin:0 0 6px; font-weight:600; }
  input, select, button { width:100%; padding:10px; margin:0 0 14px; border:1px solid #ddd; border-radius:8px; }
  button { background:#0f172a; color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  #status { min-height:24px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
</style>
</head>
<body>

<div class="top">
  <h2>Upload School Memorandum</h2>
  <a class="btn outline" href="issuances.html">← Back to Archive</a>
</div>
<p>Only authorized school officials should upload memoranda.</p>

<form id="uploadForm">
  <label>PDF File:</label>
  <input type="file" id="file" accept="application/pdf" required>

  <label>Title:</label>
  <input type="text" id="title" placeholder="e.g. School Memorandum No. 06, s. 2026" required>

  <label>Date Issued:</label>
  <input type="date" id="date" required>

  <label>Type:</label>
  <select id="type" required>
    <option value="memorandum">Memorandum</option>
    <option value="order">Order</option>
  </select>

  <label>Level:</label>
  <select id="level" required>
    <option value="school">School</option>
    <option value="division">Division</option>
    <option value="national">National</option>
  </select>

  <label>Source (e.g. SCPHS School Head):</label>
  <input type="text" id="source" required>

  <!-- Optional: Series -->
  <!-- <label>Series (optional):</label>
  <input type="text" id="series" placeholder="e.g., SM No. 06, s. 2026"> -->

  <button id="btn" type="submit">Upload</button>
</form>

<p id="status"></p>

<script>
  // Use the /exec URL from your deployed Apps Script Web App (Execute as: Me, Access: Anyone)
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwlm5vEZejeT11dS3_Z3Hj200IigHPVqusyjI-HeDbjt5xTJ27-0BEkrpjVdfwddWok/exec";

  const form = document.getElementById("uploadForm");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
      const fileEl = document.getElementById("file");
      const file = fileEl.files[0];
      if (!file) {
        statusEl.textContent = "Please choose a PDF file.";
        return;
      }
      if ((file.type || "").indexOf("pdf") === -1) {
        statusEl.textContent = "Only PDF files are allowed.";
        return;
      }

      const title  = document.getElementById("title").value.trim();
      const date   = document.getElementById("date").value;
      const type   = document.getElementById("type").value;
      const level  = document.getElementById("level").value;
      const source = document.getElementById("source").value.trim();
      const series = (document.getElementById("series")?.value || "").trim();

      btn.disabled = true;
      statusEl.textContent = "Reading file…";

      const base64 = await readAsBase64(file);

      const payload = {
        filename: file.name,
        mimeType: file.type || "application/pdf",
        data: base64,
        title, date, type, level, source, series
        // passcode: "SCPHS-UPLOAD" // if you enabled one in Apps Script
      };

      statusEl.textContent = "Uploading… please wait.";
      const res = await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids preflight
        body: JSON.stringify(payload)
      });

      const text = await res.text();
      let out = {};
      try { out = JSON.parse(text); } catch(e) {}

      if (!res.ok || !out.ok) {
        throw new Error((out && out.error) ? out.error : `HTTP ${res.status}: ${text}`);
      }

      statusEl.innerHTML = `
        <span style="color:#15803d;">Uploaded and added to archive.</span><br>
        ${out.viewerUrl ? `<a href="${out.viewerUrl}" target="_blank" rel="noopener noreferrer">Open Viewer</a>` : ""}
        ${out.downloadUrl ? ` · <a href="${out.downloadUrl}" target="_blank" rel="noopener noreferrer">Download PDF</a>` : ""}
      `;
      form.reset();
      fileEl.value = "";

    } catch (err) {
      statusEl.innerHTML = `<span style="color:#b91c1c;">Error: ${String(err)}</span>`;
    } finally {
      btn.disabled = false;
    }
  });

  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => {
        const res = String(fr.result || "");
        const comma = res.indexOf(",");
        resolve(comma >= 0 ? res.slice(comma + 1) : res); // strip data:...;base64,
      };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }
</script>

</body>
</html>
