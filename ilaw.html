<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILAW Lesson Planner — SCPHS</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
        /* Print-only document — hidden until printing */
    .print-doc {
      display: none;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; }

    .ilaw-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; padding: 20px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .ilaw-header-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .ilaw-header h1 { margin: 0 0 4px; font-size: 1.3rem; }
    .ilaw-header .sub { margin: 0; opacity: 0.85; font-size: 0.85rem; }
    .ilaw-header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .ilaw-container { max-width: 1400px; margin: 0 auto; padding: 24px; }

    .btn { padding: 9px 16px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; text-decoration: none; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-success { background: #059669; color: #fff; }
    .btn-warning { background: #d97706; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-outline { background: #fff; color: #1e3c72; border: 1px solid #1e3c72; }
    .btn-outline-white { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .btn-outline-white:hover { background: rgba(255,255,255,0.25); }
    .btn.small { padding: 6px 12px; font-size: 12px; }

    .context-bar {
      background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .context-bar label { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 4px; }
    .context-bar select { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; min-width: 160px; }

    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

    .bow-info { background: #eff6ff; border: 1px solid #bfdbfe; border-left: 4px solid #1e40af; border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
    .bow-info .lbl { font-size: 11px; font-weight: 800; color: #1e40af; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .bow-info .txt { font-size: 13px; color: #1e3a8a; line-height: 1.55; }
    .bow-info.perf { border-left-color: #166534; background: #f0fdf4; }
    .bow-info.perf .lbl { color: #166534; }
    .bow-info.perf .txt { color: #14532d; }

    .section { background: #fff; border-radius: 12px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; }
    .section-head { padding: 14px 20px; background: linear-gradient(90deg, #1e3c72, #2a5298); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .03em; }
    .section-head .hint { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .section-body { padding: 18px 20px; }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { font-size: 11.5px; font-weight: 800; color: #374151; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; display: block; }
    .field textarea, .field input[type="text"], .field input[type="number"], .field select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13.5px; font-family: inherit; resize: vertical; line-height: 1.55; }
    .field textarea { min-height: 80px; }
    .field textarea:focus, .field input:focus, .field select:focus { outline: none; border-color: #1e6bb8; box-shadow: 0 0 0 3px rgba(30,107,184,.12); }

    .comp-picker { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 4px; }
    .comp-check { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f9fafb; cursor: pointer; transition: all .15s; }
    .comp-check:hover { background: #fff; border-color: #bfdbfe; }
    .comp-check input { margin-top: 3px; flex-shrink: 0; }
    .comp-check.checked { background: #eff6ff; border-color: #1e40af; }
    .comp-check .code { font-family: monospace; font-size: 11px; color: #1e40af; font-weight: 700; margin-bottom: 3px; }
    .comp-check .text { font-size: 12.5px; color: #111827; line-height: 1.5; }

    .rubric-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rubric-table th { text-align: left; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #374151; background: #f9fafb; }
    .rubric-table td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
    .rubric-table input[type="radio"] { transform: scale(1.2); }

    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
    .status-badge.draft { background: #fef3c7; color: #92400e; }
    .status-badge.final { background: #d1fae5; color: #065f46; }

    .action-bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #e5e7eb; padding: 14px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 -24px -24px; box-shadow: 0 -4px 12px rgba(0,0,0,.05); }

    .loading { text-align: center; padding: 60px 20px; color: #6b7280; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #1e3c72; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; transition: all .25s; z-index: 10000; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #059669; }
    .toast.error { background: #b91c1c; }

        /* ============================================================
       PRINT-ONLY LAYOUT (A4 LANDSCAPE — Compact DepEd format)
       ============================================================ */
    @page {
      size: A4 landscape;
      margin: 8mm 10mm;
    }

    @media print {
      body { background: #fff; font-size: 9.5pt; margin: 0; }
      .ilaw-header, .context-bar, .action-bar, .toast, .section, .loading, .btn, .bow-info { display: none !important; }
      .ilaw-container { padding: 0; max-width: 100%; }
      .print-doc { display: block !important; width: 100%; }

      /* ---------- Header (compact) ---------- */
      .print-header { text-align: center; margin-bottom: 3mm; }
      .print-deped-logo { display: block; margin: 0 auto 2mm; max-height: 14mm; }
      .print-header-line1 { font-size: 10pt; font-weight: 500; line-height: 1.2; }
      .print-header-line2 { font-size: 11.5pt; font-weight: 800; line-height: 1.2; letter-spacing: .02em; }
      .print-header-region { font-size: 9pt; line-height: 1.2; margin-top: 0.5mm; }
      .print-header-division { font-size: 9pt; line-height: 1.2; }

      .print-school-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 3mm;
        margin-top: 2.5mm;
        padding-bottom: 2mm;
        border-bottom: 1.5px solid #000;
      }
      .print-school-logo { max-height: 13mm; }
      .print-school-center { text-align: center; flex: 1; }
      .print-school-name { font-size: 12pt; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; }
      .print-school-address { font-size: 8.5pt; line-height: 1.2; margin-top: 0.5mm; }

      .print-title { text-align: center; font-size: 12pt; font-weight: 800; letter-spacing: .06em; margin: 3mm 0 2.5mm; text-transform: uppercase; }

      /* ---------- Lesson info grid (compact) ---------- */
      .print-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1mm 5mm;
        font-size: 9.5pt;
        margin-bottom: 2.5mm;
        padding: 2mm 3mm;
        border: 1px solid #000;
      }
      .print-info-item { display: flex; gap: 1.5mm; line-height: 1.3; }
      .print-info-label { font-weight: 700; min-width: 20mm; }
      .print-info-value { flex: 1; border-bottom: 1px dotted #666; padding-bottom: 0.3mm; }

      /* ---------- Sections grid (2 columns, compact) ---------- */
      .print-sections-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2mm;
        margin-top: 2.5mm;
      }

      .print-section {
        border: 1px solid #000;
        padding: 2mm 3mm;
        page-break-inside: avoid;
        font-size: 9pt;
      }
      .print-section.full { grid-column: 1 / -1; }

      .print-section-title {
        font-size: 10pt;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .03em;
        margin: 0 0 1.2mm;
        padding-bottom: 0.8mm;
        border-bottom: 1px solid #000;
      }

      .print-sub { margin-bottom: 1.2mm; }
      .print-sub-label { font-weight: 700; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .02em; color: #333; display: inline; }
      .print-sub-body { margin-top: 0.3mm; white-space: pre-wrap; line-height: 1.35; font-size: 9pt; }

      .print-competency-list { margin: 0.5mm 0 0 4mm; padding: 0; }
      .print-competency-list li { margin-bottom: 0.3mm; line-height: 1.3; }

      /* ---------- Rubric table (compact) ---------- */
      .print-rubric-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 8.5pt;
        margin-top: 0.5mm;
      }
      .print-rubric-table th, .print-rubric-table td {
        border: 1px solid #000;
        padding: 1mm 1.5mm;
        text-align: left;
        line-height: 1.25;
      }
      .print-rubric-table th { background: #eee; font-weight: 700; text-transform: uppercase; font-size: 8pt; }
      .print-rubric-table .center { text-align: center; width: 12mm; }

      /* ---------- Signatories (compact) ---------- */
      .print-signatories {
        display: flex;
        justify-content: space-around;
        gap: 6mm;
        margin-top: 4mm;
        page-break-inside: avoid;
      }
      .print-sig-col { text-align: center; flex: 1; }
      .print-sig-label { font-size: 8.5pt; margin-bottom: 8mm; }
      .print-sig-name { font-weight: 800; font-size: 9.5pt; border-top: 1px solid #000; padding-top: 0.8mm; }
      .print-sig-position { font-size: 8.5pt; }

      /* ---------- Footer (compact) ---------- */
      .print-footer {
        margin-top: 3mm;
        padding-top: 1.5mm;
        border-top: 1px solid #000;
        text-align: center;
        font-size: 8pt;
        color: #333;
        line-height: 1.3;
      }
    }
  </style>
</head>
<body>

  <header class="ilaw-header">
    <div class="ilaw-header-inner">
      <div>
        <h1>📝 ILAW Lesson Planner</h1>
        <p class="sub" id="headerSub">Loading…</p>
      </div>
      <div class="ilaw-header-actions">
        <span id="statusBadge"></span>
        <a href="admin.html" class="btn btn-outline-white small">← Back to Portal</a>
      </div>
    </div>
  </header>

  <main class="ilaw-container" id="mainContent">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Loading ILAW planner…</div>
    </div>

    <div id="content" style="display:none;">
      <div class="context-bar">
        <div>
          <label>Grade Level</label>
          <select id="pickGrade"><option value="">— Select —</option></select>
        </div>
        <div>
          <label>Subject</label>
          <select id="pickSubject"><option value="">— Select —</option></select>
        </div>
        <div>
          <label>Term</label>
          <select id="pickTerm">
            <option value="1" selected>Term 1</option>
            <option value="2">Term 2</option>
            <option value="3">Term 3</option>
            <option value="4">Term 4 (Legacy)</option>
          </select>
        </div>
        <div>
          <label>Week</label>
          <select id="pickWeek"></select>
        </div>
        <div>
          <label>School Year</label>
          <select id="pickYear">
            <option value="2026-2027" selected>2026-2027</option>
            <option value="2025-2026">2025-2026</option>
            <option value="2027-2028">2027-2028</option>
          </select>
        </div>
        <div style="margin-left:auto;">
          <button class="btn btn-primary" id="btnLoadContext" disabled>📖 Load BoW</button>
        </div>
      </div>

      <div id="editorArea"></div>
    </div>
  </main>
  <!-- Print-only document — hidden on screen, shown during print -->
  <div class="print-doc" id="printDoc"></div>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from "./assets/js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getCurrentUserProfile } from "./assets/js/roles.js";
    import "./assets/js/bow-store.js";
    import "./assets/js/ilaw-store.js";
    import "./assets/js/ilaw-config.js";

    let CURRENT_USER = null;
    let CURRENT_PROFILE = null;
    let SUBJECTS = [];
    let CURRENT_BOW = null;
    let CURRENT_LESSON_ID = null;
    let DIRTY = false;
    let ILAW_CONFIG = null;

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    let toastTimer;
    function toast(msg, type = "") {
      const t = $("toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = "toast", 3000);
    }

    // ============================================================
    // AUTH
    // ============================================================
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.replace("login.html?next=" + encodeURIComponent(location.pathname + location.search));
        return;
      }
      CURRENT_USER = user;
      CURRENT_PROFILE = await getCurrentUserProfile();

      const isStaff = CURRENT_PROFILE?.primaryRole === "teacher"
        || CURRENT_PROFILE?.primaryRole === "admin"
        || CURRENT_PROFILE?.isSuperAdmin;

      if (!isStaff) {
        $("loading").innerHTML = `
          <h2 style="color:#b91c1c;">🚫 Access Denied</h2>
          <p>Only teachers and admins can create ILAW lesson plans.</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:12px;">← Back to Portal</a>
        `;
        return;
      }

      // Load ILAW config
      ILAW_CONFIG = await window.ILAWConfig.load();

      $("pickWeek").innerHTML = Array.from({length: 13}, (_, i) =>
        `<option value="${i+1}">Week ${i+1}</option>`).join("");

      await loadSubjects();
      initContextPicker();
      attachHandlers();

      $("loading").style.display = "none";
      $("content").style.display = "block";
      $("headerSub").textContent = `Signed in as ${CURRENT_PROFILE?.name || user.email}`;

      loadFromUrl();
    });

    async function loadSubjects() {
      try {
        const snap = await getDocs(collection(db, "subjects"));
        SUBJECTS = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(s => s.active !== false);
      } catch (e) {
        SUBJECTS = [];
      }
    }

    function initContextPicker() {
      const grades = [...new Set(SUBJECTS.map(s => s.level).filter(Boolean))]
        .sort((a, b) => {
          if (a === "K") return -1;
          if (b === "K") return 1;
          return (parseInt(a) || 999) - (parseInt(b) || 999);
        });
      $("pickGrade").innerHTML = '<option value="">— Select —</option>' +
        grades.map(g => `<option value="${esc(g)}">${g === "K" ? "Kindergarten" : "Grade " + g}</option>`).join("");

      $("pickGrade").addEventListener("change", populateSubjectPicker);
      $("pickSubject").addEventListener("change", checkContextReady);
      $("pickTerm").addEventListener("change", checkContextReady);
      $("pickWeek").addEventListener("change", checkContextReady);
    }

    function populateSubjectPicker() {
      const grade = $("pickGrade").value;
      const list = SUBJECTS.filter(s => String(s.level) === String(grade));
      $("pickSubject").innerHTML = '<option value="">— Select —</option>' +
        list.map(s => `<option value="${esc(s.id)}">${esc(s.displayName || s.id)}</option>`).join("");
      checkContextReady();
    }

    function checkContextReady() {
      const ready = !!$("pickGrade").value && !!$("pickSubject").value &&
                    !!$("pickTerm").value && !!$("pickWeek").value;
      $("btnLoadContext").disabled = !ready;
    }

    function attachHandlers() {
      $("btnLoadContext").addEventListener("click", loadContext);
    }

    async function loadContext() {
      const subjectCode = $("pickSubject").value;
      const term = parseInt($("pickTerm").value, 10);
      const week = parseInt($("pickWeek").value, 10);
      const schoolYear = $("pickYear").value;

      if (!subjectCode) { toast("⚠️ Please select a subject", "error"); return; }

      $("editorArea").innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading BoW and lesson...</div>
        </div>
      `;

      try {
        const termDoc = await window.BoW.getBoWTerm(subjectCode, term);
        const competencies = termDoc ? await window.BoW.listCompetencies(subjectCode, term) : [];
        CURRENT_BOW = { termDoc, competencies };

        const existing = await window.ILAW.findLesson(
          CURRENT_USER.uid, subjectCode, term, week, schoolYear
        );
        CURRENT_LESSON_ID = existing?.id || null;

        renderEditor(existing);
      } catch (e) {
        console.error(e);
        $("editorArea").innerHTML = `
          <div class="card" style="text-align:center;padding:40px;">
            <div style="font-size:2.5rem;">⚠️</div>
            <h3 style="color:#b91c1c;margin:8px 0 4px;">Load failed</h3>
            <p style="color:#6b7280;font-size:13px;">${esc(e.message || "Unknown error")}</p>
          </div>
        `;
      }
    }

    function renderEditor(existing) {
      const subjectCode = $("pickSubject").value;
      const subjectName = $("pickSubject").selectedOptions[0].textContent;
      const gradeLevel = $("pickGrade").value;
      const term = parseInt($("pickTerm").value, 10);
      const week = parseInt($("pickWeek").value, 10);

      const bow = CURRENT_BOW;
      const comps = bow.competencies || [];
      const contentStd = bow.termDoc?.contentStandard || "";
      const perfStd = bow.termDoc?.performanceStandard || "";

      const selectedCodes = new Set(existing?.competencyCodes || []);
      const e = existing || {};
      const status = e.status || "draft";

      const byTopic = {};
      comps.forEach(c => {
        const t = c.topicLabel || "(untitled)";
        if (!byTopic[t]) byTopic[t] = { items: [], orderIndex: c.topicOrderIndex || 999 };
        byTopic[t].items.push(c);
      });
      const topicList = Object.entries(byTopic)
        .sort((a, b) => a[1].orderIndex - b[1].orderIndex);

      const RUBRIC = [
        ["intentions_clear", "Intentions are clearly stated, with appropriate learning competencies articulated."],
        ["intentions_coherent", "Intentions are evident across all sections, there is coherence."],
        ["learning_clear", "Learning experience is clear — another teacher can implement this lesson."],
        ["learning_designed", "Learning experience is well-designed, with embedded Learning Design Principles."],
        ["integration_maximized", "Learning experience maximizes opportunities for integration."],
        ["inclusive", "Learning experience is inclusive, supports learners with disabilities and unique contexts."],
        ["assessment_integrated", "Assessment strategies are integrated throughout the session."],
        ["assessment_evidence", "Assessment strategies generate evidence of learning."],
        ["interventions_actionable", "Interventions are actionable, providing ways to extend or adjust learning."],
      ];
      const rubric = e.rubric || {};

      const sign = e.signatories || {};
      const sectionOptions = e.section ? [e.section] : [];

      $("editorArea").innerHTML = `
        <!-- LESSON INFORMATION -->
        <div class="section">
          <div class="section-head">
            <div>
              <h2>📋 LESSON INFORMATION</h2>
              <div class="hint">Basic details for this lesson plan</div>
            </div>
          </div>
          <div class="section-body">
            <div style="display:grid;grid-template-columns:2fr 1fr 2fr 1fr;gap:12px;margin-bottom:14px;">
              <div class="field" style="margin:0;">
                <label class="field-label">Lesson Title</label>
                <input type="text" id="f-lessonTitle" value="${esc(e.lessonTitle || `${subjectName} — Term ${term} Week ${week}`)}" />
              </div>
              <div class="field" style="margin:0;">
                <label class="field-label">No. of Sessions</label>
                <input type="number" id="f-noOfSessions" min="1" max="10" value="${e.noOfSessions || 5}" />
              </div>
              <div class="field" style="margin:0;">
                <label class="field-label">Teacher Name</label>
                <input type="text" id="f-teacherName" value="${esc(e.teacherName || CURRENT_PROFILE?.name || CURRENT_USER.email)}" />
              </div>
              <div class="field" style="margin:0;">
                <label class="field-label">Section</label>
                <select id="f-section">
                  <option value="">— Select —</option>
                  ${sectionOptions.map(s => `<option value="${esc(s)}" ${e.section === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
                </select>
              </div>
            </div>
          </div>
        </div>

        ${contentStd ? `<div class="bow-info"><div class="lbl">📘 Content Standard</div><div class="txt">${esc(contentStd)}</div></div>` : ""}
        ${perfStd ? `<div class="bow-info perf"><div class="lbl">⭐ Performance Standard</div><div class="txt">${esc(perfStd)}</div></div>` : ""}

        <!-- REFERENCES -->
        <div class="section">

    async function loadSectionsForTeacher(subjectCode, currentSection) {
      try {
        const select = document.getElementById("f-section");
        if (!select) return;
        const classesSnap = await getDocs(collection(db, "classes"));
        const myClasses = [];
        for (const classDoc of classesSnap.docs) {
          const cls = { id: classDoc.id, ...classDoc.data() };
          const isAdviser = cls.adviserUid === CURRENT_USER.uid;
          let hasSubject = false;
          if (!isAdviser) {
            try {
              const progSnap = await getDocs(collection(db, "classes", cls.id, "program"));
              hasSubject = progSnap.docs.some(d => {
                const e = d.data();
                return e.teacherUid === CURRENT_USER.uid && (e.subject || e.subjectName) === subjectCode;
              });
            } catch {}
          }
          if (isAdviser || hasSubject) myClasses.push(cls.classLabel || "(unnamed class)");
        }
        const sections = [...new Set(myClasses)].sort();
        if (sections.length) {
          select.innerHTML = '<option value="">— Select —</option>' +
            sections.map(s => `<option value="${esc(s)}" ${currentSection === s ? "selected" : ""}>${esc(s)}</option>`).join("");
        } else {
          select.outerHTML = `<input type="text" id="f-section" value="${esc(currentSection || "")}" placeholder="e.g., Grade 7 - DIAMOND" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13.5px;font-family:inherit;" />`;
        }
      } catch (e) {}
    }

    function updateDirtyIndicator() {
      const el = $("dirtyIndicator");
      if (!el) return;
      el.textContent = DIRTY ? "• Unsaved changes" : "";
      el.style.color = DIRTY ? "#d97706" : "#6b7280";
    }

    async function saveLesson(status) {
      const subjectCode = $("pickSubject").value;
      const subjectName = $("pickSubject").selectedOptions[0].textContent;
      const gradeLevel = $("pickGrade").value;
      const term = parseInt($("pickTerm").value, 10);
      const week = parseInt($("pickWeek").value, 10);
      const schoolYear = $("pickYear").value;

      const checked = Array.from(document.querySelectorAll("[data-comp-code]:checked"));
      let competencyCodes = checked.map(cb => cb.dataset.compCode);
      let competencyTexts = checked.map(cb => cb.dataset.compText);

      const manualComps = document.getElementById("manualComps");
      if (manualComps && manualComps.value.trim()) {
        const lines = manualComps.value.split("\n").map(l => l.trim()).filter(Boolean);
        lines.forEach((line, idx) => {
          competencyCodes.push(`T${term}-M${idx + 1}`);
          competencyTexts.push(line);
        });
      }

      const rubric = {};
      ["intentions_clear","intentions_coherent","learning_clear","learning_designed","integration_maximized","inclusive","assessment_integrated","assessment_evidence","interventions_actionable"].forEach(key => {
        const r = document.querySelector(`input[name="rubric_${key}"]:checked`);
        rubric[key] = r?.value || "not_yet";
      });

      const aiDecl = document.querySelector('input[name="aiDecl"]:checked')?.value || "not-used";
      const sectionEl = document.getElementById("f-section");
      const section = sectionEl?.value?.trim() || "";

      const data = {
        teacherUid: CURRENT_USER.uid,
        teacherName: ($("f-teacherName")?.value || "").trim() || CURRENT_PROFILE?.name || CURRENT_USER.email,
        subjectCode, subjectName, gradeLevel, term, week, schoolYear,
        title: ($("f-lessonTitle")?.value || "").trim(),
        lessonTitle: ($("f-lessonTitle")?.value || "").trim(),
        noOfSessions: parseInt($("f-noOfSessions")?.value, 10) || 5,
        section, status,
        references: ($("f-references")?.value || "").trim(),
        competencyCodes, competencyTexts,
        contentStandard: ($("f-contentStandard")?.value || "").trim(),
        performanceStandard: ($("f-performanceStandard")?.value || "").trim(),
        learnerContext: ($("f-learnerContext")?.value || "").trim(),
        preLesson: ($("f-preLesson")?.value || "").trim(),
        lessonFlow: ($("f-lessonFlow")?.value || "").trim(),
        materialsText: ($("f-materialsText")?.value || "").trim(),
        integration: ($("f-integration")?.value || "").trim(),
        assessment: ($("f-assessment")?.value || "").trim(),
        extendedLearning: ($("f-extendedLearning")?.value || "").trim(),
        waysForward: ($("f-waysForward")?.value || "").trim(),
        teacherReflections: ($("f-teacherReflections")?.value || "").trim(),
        rubric,
        coaching: {
          notes: ($("f-coachingNotes")?.value || "").trim(),
          coachName: ($("f-coachName")?.value || "").trim(),
        },
        signatories: {
          preparedByName: ($("f-sig-preparedName")?.value || "").trim(),
          preparedByPosition: ($("f-sig-preparedPos")?.value || "").trim(),
          checkedByName: ($("f-sig-checkedName")?.value || "").trim(),
          checkedByPosition: ($("f-sig-checkedPos")?.value || "").trim(),
          notedByName: ($("f-sig-notedName")?.value || "").trim(),
          notedByPosition: ($("f-sig-notedPos")?.value || "").trim(),
        },
        aiDeclaration: aiDecl,
        aiDeclarationNotes: ($("f-aiDeclarationNotes")?.value || "").trim(),
        lastSavedBy: CURRENT_USER.email || "",
      };

      try {
        const id = await window.ILAW.saveLesson(CURRENT_LESSON_ID, data);
        CURRENT_LESSON_ID = id;
        DIRTY = false;
        updateDirtyIndicator();
        toast(`✓ Lesson saved (${status})`, "success");
        $("statusBadge").innerHTML = `<span class="status-badge ${status}">${status}</span>`;
        $("statusBadgeBody").textContent = status;
        $("statusBadgeBody").className = `status-badge ${status}`;
      } catch (err) {
        toast("⚠️ " + (err.message || "Save failed"), "error");
      }
    }

    async function duplicateCurrent() {
      if (!CURRENT_LESSON_ID) { toast("⚠️ Save first, then duplicate", "error"); return; }
      const newWeek = prompt("Duplicate to which week? (1-13)", "1");
      if (!newWeek) return;
      const wk = parseInt(newWeek, 10);
      if (!wk || wk < 1 || wk > 13) { toast("⚠️ Invalid week", "error"); return; }
      try {
        const newId = await window.ILAW.duplicateLesson(CURRENT_LESSON_ID, { week: wk });
        toast("✓ Duplicated", "success");
        location.href = `ilaw.html?lesson=${newId}`;
      } catch (e) { toast("⚠️ Duplicate failed", "error"); }
    }

    async function deleteCurrent() {
      if (!CURRENT_LESSON_ID) return;
      if (!confirm("Delete this lesson plan?")) return;
      try {
        await window.ILAW.deleteLesson(CURRENT_LESSON_ID);
        toast("✓ Deleted", "success");
        setTimeout(() => location.href = "ilaw.html", 500);
      } catch (e) { toast("⚠️ Delete failed", "error"); }
    }

    async function loadFromUrl() {
      const params = new URLSearchParams(location.search);
      const lessonId = params.get("lesson");
      if (!lessonId) return;
      const lesson = await window.ILAW.getLesson(lessonId);
      if (!lesson) { toast("⚠️ Lesson not found", "error"); return; }
      if (lesson.teacherUid !== CURRENT_USER.uid && CURRENT_PROFILE?.primaryRole !== "admin" && !CURRENT_PROFILE?.isSuperAdmin) {
        toast("⚠️ No permission", "error");
        return;
      }
      $("pickGrade").value = lesson.gradeLevel;
      populateSubjectPicker();
      $("pickSubject").value = lesson.subjectCode;
      $("pickTerm").value = lesson.term;
      $("pickWeek").value = lesson.week;
      $("pickYear").value = lesson.schoolYear || "2026-2027";
      setTimeout(() => loadContext(), 100);
    }
  </script>
</body>
</html>
