<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New SSHS Encoder – SCPHS Registrar</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --gc-primary: #0f4c81;
      --gc-bg: #f1f5f9;
      --gc-border: #e2e8f0;
      --gc-text: #1e293b;
      --gc-muted: #64748b;
      --gc-success: #16a34a;
      --gc-danger: #dc2626;
    }
    body { background: var(--gc-bg); margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
    .header { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; color: var(--gc-primary); font-size: 1.5rem; font-weight: 800; }
    
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 30px; margin-bottom: 20px; display: none; }
    .card.active { display: block; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #333; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--gc-border); border-radius: 6px; font-family: inherit; font-size: 0.95rem; }
    
    .grade-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .grade-table th, .grade-table td { padding: 8px; border: 1px solid var(--gc-border); text-align: center; }
    .grade-table th { background: var(--gc-bg); font-size: 0.85rem; font-weight: 700; }
    .grade-table input, .grade-table select { width: 100%; border: none; padding: 5px; text-align: center; font-size: 1rem; font-weight: 600; background: transparent; }
    .grade-table input.sub-name { text-align: left; font-weight: 700; color: var(--gc-primary); }
    .grade-table select.type-select { font-size: 0.75rem; font-weight: bold; color: #475569; }

    .btn-save { width: 100%; background: var(--gc-success); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn-delete { background: var(--gc-danger); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; display: none; }
    .btn-row { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <h1><i class="fas fa-user-graduate"></i> New SSHS Encoder</h1>
      <a href="index.html" style="color: var(--gc-primary); text-decoration: none; font-weight: 600;">← Back to Registrar</a>
    </div>

    <div class="card active" id="search-card" style="display: block;">
      <h2 style="margin-top: 0; color: var(--gc-primary);">Search Student LRN</h2>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="search-lrn" placeholder="Enter LRN..." style="flex: 1; padding: 12px; border: 1px solid var(--gc-border); border-radius: 8px;">
        <button onclick="searchStudent()" style="background: var(--gc-primary); color: #fff; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: 600;">Search</button>
      </div>
    </div>

    <div class="card" id="encoder-card">
      <h2 style="margin-top: 0; color: var(--gc-primary);">Encode New SSHS Record</h2>
      
      <form id="sf10-form" onsubmit="saveSF10(event)">
        <input type="hidden" id="doc-id" value="">
        
        <div class="form-grid">
          <div class="form-group"><label>Last Name</label><input type="text" id="f-lastname" required></div>
          <div class="form-group"><label>First Name</label><input type="text" id="f-firstname" required></div>
          <div class="form-group"><label>Middle Name</label><input type="text" id="f-middlename"></div>
          <div class="form-group"><label>LRN</label><input type="text" id="f-lrn" required maxlength="12"></div>
        </div>

        <div class="form-grid" style="background: #eff6ff; padding: 15px; border-radius: 8px; border: 1px solid #bfdbfe;">
          <div class="form-group">
            <label>Grade Level</label>
            <select id="f-gradelevel" required>
              <option value="Grade 11">Grade 11</option>
              <option value="Grade 12">Grade 12</option>
            </select>
          </div>
          <div class="form-group">
            <label>Semester</label>
            <select id="f-semester" required>
              <option value="FIRST SEMESTER">First Semester</option>
              <option value="SECOND SEMESTER">Second Semester</option>
            </select>
          </div>
          <div class="form-group">
            <label>Track / Strand</label>
            <select id="f-track" required>
              <option value="">Select Track...</option>
              <option value="ACADEMIC - STEM">Academic - STEM</option>
              <option value="ACADEMIC - ABM">Academic - ABM</option>
              <option value="ACADEMIC - HUMSS">Academic - HUMSS</option>
              <option value="ACADEMIC - GAS">Academic - GAS</option>
              <option value="TECHPRO - TVL">TechPro - TVL</option>
            </select>
          </div>
          <div class="form-group">
            <label>School Year</label>
            <select id="f-schoolyear" required>
              <option value="2024-2025">2024-2025</option>
              <option value="2023-2024">2023-2024</option>
              <option value="2022-2023">2022-2023</option>
            </select>
          </div>
          <div class="form-group">
            <label>Section</label>
            <input type="text" id="f-section">
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin: 20px 0 10px;">
          <h3 style="font-size: 1rem; color: var(--gc-primary); margin: 0;">Subject Grades</h3>
          <button type="button" onclick="addRow()" style="background: #475569; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;"><i class="fas fa-plus"></i> Add Subject</button>
        </div>
        
        <div style="overflow-x: auto;">
          <table class="grade-table">
            <thead>
              <tr>
                <th style="width: 15%;">Type</th>
                <th style="width: 40%; text-align: left;">Subject</th>
                <th>Q1</th><th>Q2</th>
                <th>Final</th><th>Remarks</th>
              </tr>
            </thead>
            <tbody id="grades-tbody"></tbody>
          </table>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-save" id="btn-save"><i class="fas fa-save"></i> Save SSHS Record</button>
          <button type="button" class="btn-delete" id="btn-delete" onclick="deleteRecord()"><i class="fas fa-trash"></i> Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "../../assets/js/firebase-config.js";
    import { collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let CURRENT_RECORD_ID = null;

    // Auto-compute Final grade
    document.getElementById('grades-tbody').addEventListener('input', function(e) {
      if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
        const row = e.target.closest('tr');
        const q1 = parseFloat(row.querySelector('.q1').value) || 0;
        const q2 = parseFloat(row.querySelector('.q2').value) || 0;
        if (q1 > 0 && q2 > 0) {
          const final = Math.round((q1 + q2) / 2);
          row.querySelector('.final').value = final;
          row.querySelector('.remarks').value = final >= 75 ? 'PASSED' : 'FAILED';
        }
      }
    });

    window.addRow = function(data = null) {
      const tbody = document.getElementById('grades-tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <select class="type-select" style="border: 1px solid #cbd5e1; border-radius: 4px;">
            <option value="CORE" ${data?.type === 'CORE' ? 'selected' : ''}>CORE</option>
            <option value="APPLIED" ${data?.type === 'APPLIED' ? 'selected' : ''}>APPLIED</option>
            <option value="SPECIALIZED" ${data?.type === 'SPECIALIZED' ? 'selected' : ''}>SPECIALIZED</option>
          </select>
        </td>
        <td><input type="text" class="sub-name" value="${data?.sub || data?.subject || ''}" placeholder="Subject Name"></td>
        <td><input type="number" class="q1" value="${data?.q1 || ''}"></td>
        <td><input type="number" class="q2" value="${data?.q2 || ''}"></td>
        <td><input type="number" class="final" value="${data?.final || ''}" readonly style="background:#f8fafc;"></td>
        <td><input type="text" class="remarks" value="${data?.remarks || ''}" readonly style="background:#f8fafc;"></td>
      `;
      tbody.appendChild(tr);
    };

    window.searchStudent = async function() {
      const lrn = document.getElementById('search-lrn').value.trim();
      if (!lrn) return alert("Enter LRN");

      try {
        const q = query(collection(db, "sf10_archives"), where("lrn", "==", lrn), where("gradingSystem", "==", "semestral"));
        const snap = await getDocs(q);

        if (!snap.empty) {
          const records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          records.sort((a,b) => b.schoolYear.localeCompare(a.schoolYear));
          loadRecord(records[0]);
        } else {
          alert("No SSHS record found. You can create a new one.");
          document.getElementById('encoder-card').style.display = 'block';
          document.getElementById('f-lrn').value = lrn;
          document.getElementById('grades-tbody').innerHTML = '';
          addRow();
        }
      } catch (error) { console.error(error); }
    };

    function loadRecord(data) {
      CURRENT_RECORD_ID = data.id;
      document.getElementById('encoder-card').style.display = 'block';
      document.getElementById('btn-delete').style.display = 'block';
      
      document.getElementById('doc-id').value = data.id;
      document.getElementById('f-lastname').value = data.lastName || "";
      document.getElementById('f-firstname').value = data.firstName || "";
      document.getElementById('f-middlename').value = data.middleName || "";
      document.getElementById('f-lrn').value = data.lrn || "";
      document.getElementById('f-gradelevel').value = data.gradeLevel || "Grade 11";
      document.getElementById('f-semester').value = data.semester || "FIRST SEMESTER";
      document.getElementById('f-track').value = data.trackStrand || "";
      document.getElementById('f-schoolyear').value = data.schoolYear || "";
      document.getElementById('f-section').value = data.section || "";

      const tbody = document.getElementById('grades-tbody');
      tbody.innerHTML = '';
      if (data.grades) data.grades.forEach(g => addRow(g));
      else addRow();
    }

    window.deleteRecord = async function() {
      if (!CURRENT_RECORD_ID || !confirm("Delete this record?")) return;
      await deleteDoc(doc(db, "sf10_archives", CURRENT_RECORD_ID));
      location.reload();
    };

    window.saveSF10 = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.innerHTML = 'Saving...'; btn.disabled = true;

      try {
        const rows = document.querySelectorAll('#grades-tbody tr');
        const grades = [];
        rows.forEach(row => {
          const sub = row.querySelector('.sub-name').value.trim();
          if (sub) {
            grades.push({
              sub: sub, subject: sub,
              type: row.querySelector('.type-select').value,
              q1: row.querySelector('.q1').value,
              q2: row.querySelector('.q2').value,
              final: row.querySelector('.final').value,
              remarks: row.querySelector('.remarks').value
            });
          }
        });

        const lrn = document.getElementById('f-lrn').value.trim();
        const gradeLevel = document.getElementById('f-gradelevel').value;
        const semester = document.getElementById('f-semester').value;
        const schoolYear = document.getElementById('f-schoolyear').value;

        const docId = `${lrn}_${schoolYear}_${gradeLevel.replace(/\s+/g,'')}_${semester.replace(/\s+/g,'')}`;
        
        const dataToSave = {
          lrn: lrn,
          lastName: document.getElementById('f-lastname').value.trim(),
          firstName: document.getElementById('f-firstname').value.trim(),
          middleName: document.getElementById('f-middlename').value.trim(),
          gradeLevel: gradeLevel,
          semester: semester,
          trackStrand: document.getElementById('f-track').value,
          schoolYear: schoolYear,
          section: document.getElementById('f-section').value,
          gradingSystem: "semestral",
          grades: grades,
          updatedAt: Date.now()
        };

        const docRef = doc(db, "sf10_archives", docId);
        const snap = await getDoc(docRef);

        if (snap.exists()) {
          await updateDoc(docRef, dataToSave);
          alert("Updated successfully!");
        } else {
          dataToSave.createdAt = Date.now();
          await setDoc(docRef, dataToSave);
          alert("Saved successfully!");
        }
        location.reload();

      } catch (error) { console.error(error); alert("Error saving"); }
      finally { btn.innerHTML = 'Save'; btn.disabled = false; }
    };
  </script>
</body>
</html>
