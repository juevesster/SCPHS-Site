<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SF10 Digital Archive – SCPHS Registrar</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --gc-primary: #0f4c81;
      --gc-accent: #2563eb;
      --gc-bg: #f1f5f9;
      --gc-card: #ffffff;
      --gc-border: #e2e8f0;
      --gc-text: #1e293b;
      --gc-muted: #64748b;
      --gc-success: #16a34a;
      --gc-danger: #dc2626;
    }
    
    body { background: var(--gc-bg); margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

    .header { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
    .header h1 { margin: 0; color: var(--gc-primary); font-size: 1.5rem; font-weight: 800; }
    
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px 16px; border: 1px solid var(--gc-border); border-radius: 8px; font-size: 1rem; outline: none; }
    .search-box input:focus { border-color: var(--gc-accent); }
    .btn-search { background: var(--gc-primary); color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: #fff; border: 1px solid var(--gc-border); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; color: var(--gc-muted); }
    .tab-btn.active { background: var(--gc-primary); color: #fff; border-color: var(--gc-primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Encoder Form */
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 30px; margin-bottom: 20px; display: none; }
    .card.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 1.1rem; color: var(--gc-primary); border-bottom: 2px solid var(--gc-border); padding-bottom: 10px; margin-bottom: 20px; font-weight: 700; text-transform: uppercase; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #333; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--gc-border); border-radius: 6px; font-family: inherit; font-size: 0.95rem; }
    
    /* Grade Table */
    .grade-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .grade-table th, .grade-table td { padding: 8px; border: 1px solid var(--gc-border); text-align: center; }
    .grade-table th { background: var(--gc-bg); font-size: 0.85rem; font-weight: 700; color: var(--gc-text); }
    .grade-table input { width: 100%; border: none; padding: 5px; text-align: center; font-size: 1rem; font-weight: 600; background: transparent; }
    .grade-table input.sub-name { text-align: left; font-weight: 700; color: var(--gc-primary); }
    .grade-table input:focus { background: #eff6ff; outline: none; border-radius: 4px; }

    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-save { flex: 1; background: var(--gc-success); color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-save:hover { background: #15803d; transform: translateY(-2px); }
    .btn-delete { background: var(--gc-danger); color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: none; justify-content: center; align-items: center; gap: 8px; }
    .btn-delete:hover { background: #b91c1c; transform: translateY(-2px); }

    /* Status Banner */
    .status-banner { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 600; text-align: center; }
    .status-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-found { background: #e0f2fe; color: #1e40af; border: 1px solid #bfdbfe; }
    .status-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

  </style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <h1><i class="fas fa-file-archive"></i> SF10 Digital Archive</h1>
      <a href="index.html" style="color: var(--gc-primary); text-decoration: none; font-weight: 600;">← Back to Registrar</a>
    </div>

    <div class="status-banner" id="status-banner"></div>

    <!-- SEARCH SECTION -->
    <div class="card active" id="search-card">
      <h2 class="section-title">Search Archived SF10 Records</h2>
      <div class="search-box">
        <input type="text" id="search-lrn" placeholder="Enter Student LRN (e.g., 104142140021)..." onkeypress="if(event.key==='Enter') searchStudent()">
        <button class="btn-search" onclick="searchStudent()"><i class="fas fa-search"></i> Search</button>
      </div>
    </div>

    <!-- ENCODER FORM -->
    <div class="card" id="encoder-card">
      <h2 class="section-title" id="form-title">Encode SF10 Record</h2>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchEncTab('grades')">Yearly Grades</button>
        <button class="tab-btn" onclick="switchEncTab('eligibility')">JHS Eligibility</button>
      </div>

      <form id="sf10-form" onsubmit="saveSF10(event)">
        <input type="hidden" id="doc-id" value="">
        
        <!-- Common Student Info -->
        <div class="form-grid">
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="f-lastname" required>
          </div>
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="f-firstname" required>
          </div>
          <div class="form-group">
            <label>Middle Name</label>
            <input type="text" id="f-middlename">
          </div>
          <div class="form-group">
            <label>Name Extension (Jr, I, II)</label>
            <input type="text" id="f-extname">
          </div>
          <div class="form-group">
            <label>LRN</label>
            <input type="text" id="f-lrn" required maxlength="12">
          </div>
        </div>

        <!-- TAB 1: GRADES -->
        <div class="tab-content active" id="tab-grades">
          <div class="form-grid">
            <div class="form-group">
              <label>Grade Level</label>
              <select id="f-gradelevel" onchange="handleGradeChange()" required>
                <option value="">Select Grade Level...</option>
                <optgroup label="Junior High School">
                  <option value="Grade 7">Grade 7</option>
                  <option value="Grade 8">Grade 8</option>
                  <option value="Grade 9">Grade 9</option>
                  <option value="Grade 10">Grade 10</option>
                </optgroup>
                <optgroup label="Senior High School">
                  <option value="Grade 11">Grade 11</option>
                  <option value="Grade 12">Grade 12</option>
                </optgroup>
              </select>
            </div>
            <div class="form-group" id="track-group" style="display: none;">
              <label>Track / Strand</label>
              <select id="f-track" onchange="changeGradeLevel()">
                <option value="">Select Track...</option>
                <option value="Academic">Academic (STEM, ABM, HUMSS, GAS)</option>
                <option value="TechPro">TechPro / TVL</option>
              </select>
            </div>
            <div class="form-group">
              <label>Historical School Year</label>
              <select id="f-schoolyear" onchange="resetForNewYear()" required>
                <option value="">Select School Year...</option>
                <option value="2026-2027">2026-2027</option>
                <option value="2025-2026">2025-2026</option>
                <option value="2024-2025">2024-2025</option>
                <option value="2023-2024">2023-2024</option>
                <option value="2022-2023">2022-2023</option>
                <option value="2021-2022">2021-2022</option>
                <option value="2020-2021">2020-2021</option>
                <option value="2019-2020">2019-2020</option>
                <option value="2018-2019">2018-2019</option>
              </select>
            </div>
            <div class="form-group" style="background: #eff6ff; padding: 10px; border-radius: 8px; border: 1px solid #bfdbfe;">
              <label style="color: var(--gc-accent);">Grading System</label>
              <select id="f-sys" onchange="updateTableHeaders()" style="font-weight: bold; border-color: var(--gc-accent);">
                <option value="4q">Old Curriculum (4 Quarters)</option>
                <option value="3t">New Curriculum (3 Terms)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Section</label>
              <input type="text" id="f-section" placeholder="e.g. Ruby">
            </div>
            <div class="form-group">
              <label>Name of Adviser (for this year)</label>
              <input type="text" id="f-adviser" placeholder="Adviser for this specific grade level">
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px;">
            <h3 style="font-size: 1rem; color: var(--gc-primary); margin: 0;">Subject Grades</h3>
            <button type="button" class="btn-search" onclick="addRow()" style="padding: 8px 16px; font-size: 0.85rem; background: #475569;"><i class="fas fa-plus"></i> Add Subject Row</button>
          </div>
          
          <div class="grade-table-wrap" style="overflow-x: auto;">
            <table class="grade-table">
              <thead>
                <tr id="grade-header-row">
                  <th style="width: 35%; text-align: left;">Learning Area / Subject</th>
                  <th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th>
                  <th>Final</th><th>Remarks</th>
                </tr>
              </thead>
              <tbody id="grades-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- TAB 2: ELIGIBILITY -->
        <div class="tab-content" id="tab-eligibility">
          <p style="color: var(--gc-muted); font-size: 0.9rem; margin-bottom: 20px;">These details are saved to the student's master record.</p>
          
          <div class="form-grid">
            <div class="form-group">
              <label>Elementary School Completed</label>
              <input type="text" id="f-elem-school" placeholder="Name of Elementary School">
            </div>
            <div class="form-group">
              <label>Elem School ID</label>
              <input type="text" id="f-elem-school-id" placeholder="School ID">
            </div>
            <div class="form-group full" style="grid-column: 1/-1;">
              <label>Elem Address</label>
              <input type="text" id="f-elem-address" placeholder="Address of Elementary School">
            </div>
            <div class="form-group">
              <label>General Average</label>
              <input type="text" id="f-elem-ga" placeholder="e.g. 88">
            </div>
            <div class="form-group">
              <label>Citation (if any)</label>
              <input type="text" id="f-elem-citation">
            </div>
          </div>

          <h3 style="font-size: 1rem; color: var(--gc-primary); margin: 20px 0 10px; border-top: 1px solid #eee; padding-top: 15px;">Other Credentials</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>PEPT Passer? (Leave blank if No)</label>
              <input type="text" id="f-pept-rating" placeholder="Rating">
            </div>
            <div class="form-group">
              <label>ALS A&E Passer? (Leave blank if No)</label>
              <input type="text" id="f-als-rating" placeholder="Rating">
            </div>
            <div class="form-group">
              <label>Others (Specify)</label>
              <input type="text" id="f-elem-others">
            </div>
            <div class="form-group">
              <label>Date of Exam/Assessment</label>
              <input type="text" id="f-elem-exam-date" placeholder="mm/dd/yyyy">
            </div>
            <div class="form-group full" style="grid-column: 1/-1;">
              <label>Testing Center</label>
              <input type="text" id="f-elem-testing-center" placeholder="Name and Address">
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-save" id="btn-save"><i class="fas fa-save"></i> Save Year Record & Eligibility</button>
          <button type="button" class="btn-delete" id="btn-delete" onclick="deleteRecord()"><i class="fas fa-trash"></i> Delete This Year</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "../../assets/js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let CURRENT_RECORD_ID = null;
    let CURRENT_SYSTEM = '4q';

    // Subject Presets with separated MAPEH
    const SUBJECT_PRESETS = {
      "JHS": ["Filipino", "English", "Mathematics", "Science", "Araling Panlipunan", "Values Education", "Technology and Livelihood Education (TLE)", "MAPEH", "Music", "Arts", "Physical Education", "Health"],
      "SHS_Academic": ["Oral Communication", "Reading and Writing", "Komunikasyon at Pananaliksik", "21st Century Literature", "General Mathematics", "Statistics and Probability", "Earth and Life Science", "Physical Science", "Personal Development", "Understanding Culture, Society, and Politics", "Physical Education and Health", "Practical Research 1", "Practical Research 2", "Media and Information Literacy", "Empowerment Technologies"],
      "SHS_TechPro": ["Oral Communication", "Reading and Writing", "Komunikasyon at Pananaliksik", "21st Century Literature", "General Mathematics", "Statistics and Probability", "Earth and Life Science", "Physical Science", "Personal Development", "Understanding Culture, Society, and Politics", "Physical Education and Health", "Practical Research 1", "Practical Research 2", "Specialized TVL Subject 1", "Specialized TVL Subject 2"]
    };

    window.switchEncTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
    };

    window.updateTableHeaders = function() {
      const sys = document.getElementById('f-sys').value;
      CURRENT_SYSTEM = sys;
      const headerRow = document.getElementById('grade-header-row');
      
      if (sys === '3t') {
        headerRow.innerHTML = `<th style="width: 35%; text-align: left;">Learning Area / Subject</th><th>Term 1</th><th>Term 2</th><th>Term 3</th><th>Final</th><th>Remarks</th>`;
      } else {
        headerRow.innerHTML = `<th style="width: 35%; text-align: left;">Learning Area / Subject</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Final</th><th>Remarks</th>`;
      }

      const tbody = document.getElementById('grades-tbody');
      const existingData = [];
      tbody.querySelectorAll('tr').forEach(row => {
        existingData.push({
          sub: row.querySelector('.sub-name').value,
          q1: row.querySelector('.q1').value, q2: row.querySelector('.q2').value, q3: row.querySelector('.q3').value,
          q4: row.querySelector('.q4') ? row.querySelector('.q4').value : "",
          final: row.querySelector('.final').value, remarks: row.querySelector('.remarks').value
        });
      });

      tbody.innerHTML = '';
      if (existingData.length === 0) { addRow(); } else { existingData.forEach(data => addRow(data)); }
    };

    window.handleGradeChange = function() {
      const grade = document.getElementById('f-gradelevel').value;
      const trackGroup = document.getElementById('track-group');
      if (grade === 'Grade 11' || grade === 'Grade 12') { trackGroup.style.display = 'block'; } 
      else { trackGroup.style.display = 'none'; document.getElementById('f-track').value = ""; }
      changeGradeLevel();
      resetForNewYear(); 
    };

    window.changeGradeLevel = function() {
      const grade = document.getElementById('f-gradelevel').value;
      const track = document.getElementById('f-track').value;
      const tbody = document.getElementById('grades-tbody');
      if (!grade) return;

      let subjects = [];
      if (grade.includes('Grade 7') || grade.includes('Grade 8') || grade.includes('Grade 9') || grade.includes('Grade 10')) {
        subjects = SUBJECT_PRESETS["JHS"];
      } else if (grade.includes('Grade 11') || grade.includes('Grade 12')) {
        if (!track) return;
        if (track === "Academic") subjects = SUBJECT_PRESETS["SHS_Academic"];
        else if (track === "TechPro") subjects = SUBJECT_PRESETS["SHS_TechPro"];
      }

      const rows = tbody.querySelectorAll('tr');
      const hasData = rows.length > 1 || (rows.length === 1 && rows[0].querySelector('.sub-name').value !== "");

      if (!hasData) {
        tbody.innerHTML = '';
        if (subjects.length > 0) { subjects.forEach(sub => addRow({ sub: sub })); } 
        else { addRow(); }
      }
    };

    window.resetForNewYear = function() {
      if (!CURRENT_RECORD_ID) return; 
      const year = document.getElementById('f-schoolyear').value;
      const grade = document.getElementById('f-gradelevel').value;
      if (!year || !grade) return;

      document.getElementById('doc-id').value = "";
      CURRENT_RECORD_ID = null;
      document.getElementById('btn-delete').style.display = 'none';
      document.getElementById('form-title').textContent = `Create New SF10 Record: ${grade} (${year})`;
      
      const tbody = document.getElementById('grades-tbody');
      tbody.innerHTML = '';
      handleGradeChange(); 
      showStatus(`Switched to creating a new record for ${grade} (${year}).`, 'status-found');
    };

    document.getElementById('grades-tbody').addEventListener('input', function(e) {
      if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
        const row = e.target.closest('tr');
        const q1 = parseFloat(row.querySelector('.q1').value) || 0;
        const q2 = parseFloat(row.querySelector('.q2').value) || 0;
        const q3 = parseFloat(row.querySelector('.q3').value) || 0;
        const q4El = row.querySelector('.q4');
        const q4 = q4El ? parseFloat(q4El.value) || 0 : 0;
        
        if (CURRENT_SYSTEM === '3t') {
          if (q1 > 0 && q2 > 0 && q3 > 0) {
            const final = Math.round((q1 + q2 + q3) / 3);
            row.querySelector('.final').value = final;
            row.querySelector('.remarks').value = final >= 75 ? 'Passed' : 'Failed';
          }
        } else {
          if (q1 > 0 && q2 > 0 && q3 > 0 && q4 > 0) {
            const final = Math.round((q1 + q2 + q3 + q4) / 4);
            row.querySelector('.final').value = final;
            row.querySelector('.remarks').value = final >= 75 ? 'Passed' : 'Failed';
          }
        }
      }
    });

    window.addRow = function(data = null) {
      const tbody = document.getElementById('grades-tbody');
      const tr = document.createElement('tr');
      let q4Html = `<td><input type="number" min="60" max="100" class="q4" value="${data?.q4 || ''}"></td>`;
      if (CURRENT_SYSTEM === '3t') { q4Html = ''; }

      tr.innerHTML = `
        <td><input type="text" placeholder="Enter Subject" class="sub-name" value="${data?.sub || ''}"></td>
        <td><input type="number" min="60" max="100" class="q1" value="${data?.q1 || ''}"></td>
        <td><input type="number" min="60" max="100" class="q2" value="${data?.q2 || ''}"></td>
        <td><input type="number" min="60" max="100" class="q3" value="${data?.q3 || ''}"></td>
        ${q4Html}
        <td><input type="number" min="60" max="100" class="final" value="${data?.final || ''}" readonly tabindex="-1" style="background:#f8fafc; cursor:not-allowed;"></td>
        <td><input type="text" class="remarks" value="${data?.remarks || ''}" readonly tabindex="-1" style="background:#f8fafc; cursor:not-allowed;"></td>
      `;
      tbody.appendChild(tr);
    };

    window.searchStudent = async function() {
      const searchTerm = document.getElementById('search-lrn').value.trim();
      if (!searchTerm) return alert("Please enter an LRN.");

      const btn = document.querySelector('.btn-search');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

      try {
        const sf10Ref = collection(db, "sf10_archives");
        const qLrn = query(sf10Ref, where("lrn", "==", searchTerm));
        const snapLrn = await getDocs(qLrn);

        let sf1Data = null;
        const sf1Ref = collection(db, "sf1_historical_archives");
        const qSF1 = query(sf1Ref, where("lrn", "==", searchTerm));
        const snapSF1 = await getDocs(qSF1);
        if (!snapSF1.empty) sf1Data = snapSF1.docs[0].data();

        if (!snapLrn.empty) {
          const records = snapLrn.docs.map(d => ({ id: d.id, ...d.data() }));
          records.sort((a,b) => b.schoolYear.localeCompare(a.schoolYear));
          const latestRecord = records[0];
          
          showStatus(`✅ Found existing record. Showing latest: ${latestRecord.gradeLevel} (${latestRecord.schoolYear})`, 'status-success');
          loadRecord(latestRecord);
        } else {
          const statusMsg = sf1Data ? `Found in SF1 Archive: ${sf1Data.lastName}, ${sf1Data.firstName}. Please encode the grades below.` : 'No existing record found. You can encode a new SF10 below.';
          showStatus(statusMsg, sf1Data ? 'status-success' : 'status-warning');
          
          document.getElementById('encoder-card').classList.add('active');
          document.getElementById('form-title').textContent = "Create New SF10 Record";
          document.getElementById('sf10-form').reset();
          document.getElementById('doc-id').value = "";
          CURRENT_RECORD_ID = null;
          document.getElementById('btn-delete').style.display = 'none';
          
          document.getElementById('f-lrn').value = searchTerm;

          if (sf1Data) {
             document.getElementById('f-lastname').value = sf1Data.lastName || "";
             document.getElementById('f-firstname').value = sf1Data.firstName || "";
             document.getElementById('f-middlename').value = sf1Data.middleName || "";
             document.getElementById('f-gradelevel').value = sf1Data.gradeLevel || "";
             document.getElementById('f-schoolyear').value = sf1Data.schoolYear || "";
             document.getElementById('f-section').value = sf1Data.section || "";
             handleGradeChange();
          } else {
            document.getElementById('grades-tbody').innerHTML = '';
            addRow();
          }
          document.getElementById('f-sys').value = '4q';
          updateTableHeaders();
        }
      } catch (error) { console.error(error); alert("❌ Error searching database."); } 
      finally { btn.innerHTML = originalText; btn.disabled = false; }
    };

    function loadRecord(data) {
      CURRENT_RECORD_ID = data.id;
      document.getElementById('encoder-card').classList.add('active');
      document.getElementById('form-title').textContent = `View / Update SF10 Record (${data.gradeLevel})`;
      document.getElementById('btn-delete').style.display = 'flex';
      
      document.getElementById('doc-id').value = CURRENT_RECORD_ID;
      document.getElementById('f-lastname').value = data.lastName || "";
      document.getElementById('f-firstname').value = data.firstName || "";
      document.getElementById('f-middlename').value = data.middleName || "";
      document.getElementById('f-extname').value = data.extName || "";
      document.getElementById('f-lrn').value = data.lrn || "";
      document.getElementById('f-gradelevel').value = data.gradeLevel || "";
      document.getElementById('f-schoolyear').value = data.schoolYear || "";
      document.getElementById('f-section').value = data.section || "";
      document.getElementById('f-adviser').value = data.adviser || "";
      document.getElementById('f-sys').value = data.gradingSystem || '4q';

      // Load Eligibility
      document.getElementById('f-elem-school').value = data.elemSchool || "";
      document.getElementById('f-elem-school-id').value = data.elemSchoolId || "";
      document.getElementById('f-elem-address').value = data.elemAddress || "";
      document.getElementById('f-elem-ga').value = data.elemGA || "";
      document.getElementById('f-elem-citation').value = data.elemCitation || "";
      document.getElementById('f-pept-rating').value = data.peptRating || "";
      document.getElementById('f-als-rating').value = data.alsRating || "";
      document.getElementById('f-elem-others').value = data.elemOthers || "";
      document.getElementById('f-elem-exam-date').value = data.elemExamDate || "";
      document.getElementById('f-elem-testing-center').value = data.elemTestingCenter || "";

      if (data.gradeLevel === 'Grade 11' || data.gradeLevel === 'Grade 12') {
        document.getElementById('track-group').style.display = 'block';
        document.getElementById('f-track').value = data.track || "";
      } else {
        document.getElementById('track-group').style.display = 'none';
      }

      updateTableHeaders();
      const tbody = document.getElementById('grades-tbody');
      tbody.innerHTML = '';
      
      if (data.grades && data.grades.length > 0) {
        const grade = data.gradeLevel;
        let defaultSubjects = SUBJECT_PRESETS["JHS"];
        if (grade.includes('11') || grade.includes('12')) defaultSubjects = SUBJECT_PRESETS["SHS_Academic"];
        
        data.grades.forEach((g, i) => {
          if (!g.sub && defaultSubjects[i]) g.sub = defaultSubjects[i];
          addRow(g);
        });
      } else {
        addRow(); 
      }
    }

    window.deleteRecord = async function() {
      if (!CURRENT_RECORD_ID) return;
      if (!confirm("Are you sure you want to DELETE this specific year record? This cannot be undone.")) return;
      try {
        await deleteDoc(doc(db, "sf10_archives", CURRENT_RECORD_ID));
        alert("✅ Record Deleted Successfully!");
        document.getElementById('sf10-form').reset();
        document.getElementById('encoder-card').classList.remove('active');
        document.getElementById('search-lrn').value = "";
        document.getElementById('status-banner').style.display = 'none';
        CURRENT_RECORD_ID = null;
      } catch (error) { console.error(error); alert("❌ Failed to delete record."); }
    };

    window.saveSF10 = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;

      try {
        const rows = document.querySelectorAll('#grades-tbody tr');
        const grades = [];
        rows.forEach(row => {
          const subject = row.querySelector('.sub-name').value.trim();
          if (subject) {
            grades.push({
              sub: subject, q1: row.querySelector('.q1').value, q2: row.querySelector('.q2').value, q3: row.querySelector('.q3').value,
              q4: row.querySelector('.q4') ? row.querySelector('.q4').value : "",
              final: row.querySelector('.final').value, remarks: row.querySelector('.remarks').value
            });
          }
        });

        const dataToSave = {
          lastName: document.getElementById('f-lastname').value.trim(),
          firstName: document.getElementById('f-firstname').value.trim(),
          middleName: document.getElementById('f-middlename').value.trim(),
          extName: document.getElementById('f-extname').value.trim(),
          lrn: document.getElementById('f-lrn').value.trim(),
          gradeLevel: document.getElementById('f-gradelevel').value,
          track: document.getElementById('f-track').value,
          schoolYear: document.getElementById('f-schoolyear').value,
          section: document.getElementById('f-section').value.trim(),
          adviser: document.getElementById('f-adviser').value.trim(),
          gradingSystem: document.getElementById('f-sys').value,
          // Eligibility Data
          elemSchool: document.getElementById('f-elem-school').value.trim(),
          elemSchoolId: document.getElementById('f-elem-school-id').value.trim(),
          elemAddress: document.getElementById('f-elem-address').value.trim(),
          elemGA: document.getElementById('f-elem-ga').value.trim(),
          elemCitation: document.getElementById('f-elem-citation').value.trim(),
          peptRating: document.getElementById('f-pept-rating').value.trim(),
          alsRating: document.getElementById('f-als-rating').value.trim(),
          elemOthers: document.getElementById('f-elem-others').value.trim(),
          elemExamDate: document.getElementById('f-elem-exam-date').value.trim(),
          elemTestingCenter: document.getElementById('f-elem-testing-center').value.trim(),
          // Grades
          grades: grades,
          updatedAt: Date.now(),
          updatedBy: auth.currentUser ? auth.currentUser.email : "OJT/Admin"
        };

        const sf10Ref = collection(db, "sf10_archives");
        const customDocId = `${dataToSave.lrn}_${dataToSave.schoolYear}_${dataToSave.gradeLevel.replace(/\s+/g,'')}`;
        const docRef = doc(db, "sf10_archives", customDocId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          await updateDoc(docRef, dataToSave);
          alert("✅ SF10 Record Updated Successfully!");
        } else {
          dataToSave.createdAt = Date.now();
          await setDoc(docRef, dataToSave);
          alert("✅ New SF10 Record Saved Successfully!");
        }
        
        document.getElementById('sf10-form').reset();
        document.getElementById('encoder-card').classList.remove('active');
        document.getElementById('search-lrn').value = "";
        document.getElementById('status-banner').style.display = 'none';
        CURRENT_RECORD_ID = null;
      } catch (error) { console.error(error); alert("❌ Failed to save record."); } 
      finally { btn.innerHTML = originalText; btn.disabled = false; }
    };

    function showStatus(msg, className) {
      const banner = document.getElementById('status-banner');
      banner.textContent = msg; banner.className = `status-banner ${className}`; banner.style.display = 'block';
    }
  </script>
</body>
</html>
