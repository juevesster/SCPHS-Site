<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SF1 LIS Importer – SCPHS Registrar</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --gc-primary: #0f4c81;
      --gc-accent: #2563eb;
      --gc-bg: #f1f5f9;
      --gc-border: #e2e8f0;
      --gc-text: #1e293b;
      --gc-muted: #64748b;
      --gc-success: #16a34a;
    }
    
    body { background: var(--gc-bg); margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

    .header { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; color: var(--gc-primary); font-size: 1.5rem; font-weight: 800; }
    
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 30px; margin-bottom: 20px; }
    .section-title { font-size: 1.1rem; color: var(--gc-primary); border-bottom: 2px solid var(--gc-border); padding-bottom: 10px; margin-bottom: 20px; font-weight: 700; text-transform: uppercase; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #333; margin-bottom: 8px; text-transform: uppercase; }
    .form-group select, .form-group input { width: 100%; padding: 12px; border: 1px solid var(--gc-border); border-radius: 8px; font-family: inherit; font-size: 1rem; }

    .upload-box { border: 2px dashed var(--gc-border); border-radius: 12px; padding: 40px; text-align: center; background: #f8fafc; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
    .upload-box:hover { border-color: var(--gc-accent); background: #eff6ff; }
    .upload-box i { font-size: 3rem; color: var(--gc-accent); margin-bottom: 15px; }
    .upload-box p { margin: 0; font-weight: 600; color: var(--gc-primary); }
    .upload-box span { font-size: 0.85rem; color: var(--gc-muted); }

    .btn-process { background: var(--gc-success); color: #fff; border: none; padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-process:hover { background: #15803d; transform: translateY(-2px); }
    .btn-process:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

    .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 600; text-align: center; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-error { background: #fee2e2; color: #991b1b; }

  </style>
  <!-- SheetJS Library to read Excel files -->
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <h1><i class="fas fa-file-excel"></i> SF1 LIS Importer</h1>
      <a href="index.html" style="color: var(--gc-primary); text-decoration: none; font-weight: 600;">← Back to Registrar</a>
    </div>

    <div class="alert alert-success" id="alert-success"></div>
    <div class="alert alert-error" id="alert-error"></div>

    <div class="card">
      <h2 class="section-title">Upload LIS SF1 Excel File</h2>
      
      <div class="form-grid">
        <div class="form-group">
          <label>Historical School Year</label>
          <select id="imp-year">
            <option value="2025-2026">2025-2026</option>
            <option value="2024-2025">2024-2025</option>
            <option value="2023-2024">2023-2024</option>
            <option value="2022-2023">2022-2023</option>
            <option value="2021-2022">2021-2022</option>
            <option value="2020-2021">2020-2021</option>
            <option value="2019-2020">2019-2020</option>
            <option value="2018-2019">2018-2019</option>
            <option value="2017-2018">2017-2018</option>
            <option value="2016-2017">2016-2017</option>
          </select>
        </div>
        <div class="form-group">
          <label>Grade Level</label>
          <select id="imp-grade">
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
        </div>
      </div>

      <div class="upload-box" onclick="document.getElementById('excel-file').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>Click to select or drag & drop SF1 Excel File</p>
        <span>Only accepts .xlsx or .xls files from LIS</span>
        <input type="file" id="excel-file" accept=".xlsx, .xls" style="display: none;" onchange="handleFileSelect(this)">
      </div>

      <div id="file-info" style="display: none; margin-bottom: 20px; font-weight: 600; color: var(--gc-accent);">
        <i class="fas fa-check-circle"></i> <span id="file-name">file.xlsx</span> selected.
      </div>

      <button class="btn-process" id="btn-import" onclick="importSF1()" disabled>
        <i class="fas fa-upload"></i> Import to Database
      </button>
    </div>
  </div>

  <script type="module">
    import { db } from "../../assets/js/firebase-config.js";
    import { collection, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let SELECTED_FILE = null;

    window.handleFileSelect = function(input) {
      if (input.files.length > 0) {
        SELECTED_FILE = input.files[0];
        document.getElementById('file-name').textContent = SELECTED_FILE.name;
        document.getElementById('file-info').style.display = 'block';
        document.getElementById('btn-import').disabled = false;
      }
    };

    window.importSF1 = async function() {
      if (!SELECTED_FILE) return;

      const year = document.getElementById('imp-year').value;
      const grade = document.getElementById('imp-grade').value;
      
      const btn = document.getElementById('btn-import');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing Data...';
      btn.disabled = true;

      document.getElementById('alert-success').style.display = 'none';
      document.getElementById('alert-error').style.display = 'none';

      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          // Assume the first sheet contains the SF1 data
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          // Convert to JSON
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          // Find the header row (usually row 3 or 4 in LIS SF1, but we'll scan for it)
          let headerRowIndex = -1;
          for (let i = 0; i < jsonData.length; i++) {
            const row = jsonData[i];
            // Look for a row that contains "LRN" and "NAME"
            if (row && row.some(cell => String(cell).toUpperCase().includes("LRN")) && 
                row.some(cell => String(cell).toUpperCase().includes("NAME"))) {
              headerRowIndex = i;
              break;
            }
          }

          if (headerRowIndex === -1) {
            throw new Error("Could not find the header row containing LRN and NAME. Please check the file.");
          }

          const headers = jsonData[headerRowIndex].map(h => String(h).toUpperCase().trim());
          
          // Find column indices
          const lrnIndex = headers.findIndex(h => h.includes("LRN") || h.includes("LEARNER REFERENCE"));
          const nameIndex = headers.findIndex(h => h.includes("NAME") && !h.includes("MOTHER") && !h.includes("FATHER"));
          
          // Note: LIS usually puts "LAST NAME, FIRST NAME, MIDDLE NAME" in one column, or separates them.
          // We'll try to find separate columns first, then fallback to a combined name column.
          let lastNameIndex = headers.findIndex(h => h === "LAST NAME" || h.includes("SURNAME"));
          let firstNameIndex = headers.findIndex(h => h === "FIRST NAME" || h.includes("GIVEN NAME"));
          let middleNameIndex = headers.findIndex(h => h.includes("MIDDLE NAME"));
          
          if (lastNameIndex === -1 && nameIndex !== -1) {
             // If separate columns aren't found, we will just use the combined name column
             console.log("Using combined name column.");
          }

          if (lrnIndex === -1) {
            throw new Error("Could not find the LRN column.");
          }

          // Extract student rows
          const students = [];
          for (let i = headerRowIndex + 1; i < jsonData.length; i++) {
            const row = jsonData[i];
            if (!row || row.length === 0) continue;
            
            const lrn = String(row[lrnIndex] || "").trim();
            if (lrn && lrn.length > 5) {
              let firstName = "", lastName = "", middleName = "";

              if (firstNameIndex !== -1 && lastNameIndex !== -1) {
                firstName = String(row[firstNameIndex] || "").trim();
                lastName = String(row[lastNameIndex] || "").trim();
                middleName = String(row[middleNameIndex] || "").trim();
              } else {
                // If combined, just dump it in lastName for now
                lastName = String(row[nameIndex] || "").trim();
              }

              students.push({
                lrn: lrn,
                lastName: lastName,
                firstName: firstName,
                middleName: middleName,
                gradeLevel: grade,
                schoolYear: year
              });
            }
          }

          if (students.length === 0) {
            throw new Error("No valid student records found. Check if the LRN column is correct.");
          }

          // Save to Firebase using Batch Write (faster and safer)
          const batch = writeBatch(db);
          const archiveRef = collection(db, "sf1_historical_archives");
          
          students.forEach(s => {
            const newDocRef = doc(archiveRef, `${year}_${s.lrn}`); // Unique ID per student per year
            batch.set(newDocRef, s);
          });

          await batch.commit();

          // Success
          document.getElementById('alert-success').style.display = 'block';
          document.getElementById('alert-success').innerHTML = `✅ Successfully imported <b>${students.length}</b> students for ${grade} (${year}).`;

        } catch (error) {
          console.error("Import error:", error);
          document.getElementById('alert-error').style.display = 'block';
          document.getElementById('alert-error').textContent = "❌ " + error.message;
        } finally {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      };
      
      reader.readAsArrayBuffer(SELECTED_FILE);
    };
  </script>
</body>
</html>
