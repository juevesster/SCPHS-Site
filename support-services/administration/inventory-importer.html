<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Import Inventory – Admin Office</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS Library for Excel Parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --sidebar-bg: #0f172a;
      --bg-color: #f4f7f9;
      --primary: #0f766e;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: 260px; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
    .sidebar-brand { padding: 30px 24px; font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sidebar-brand i { color: #14b8a6; }
    .sidebar-menu { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; }
    .menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.2s; }
    .menu-item:hover { background: #1e293b; color: #fff; }
    .menu-item.active { background: linear-gradient(90deg, #0f766e, #14b8a6); color: #fff; }

    /* Main Content */
    .main-content { margin-left: 260px; flex: 1; padding: 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .topbar h1 { font-size: 1.8rem; font-weight: 800; }

    /* Cards */
    .card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid var(--border); margin-bottom: 20px; }
    
    .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; background: #f8fafc; transition: 0.2s; }
    .upload-zone:hover { border-color: var(--primary); background: #eff6ff; }
    .upload-zone i { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
    
    .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-muted); }
    
    /* Table */
    .table-wrap { overflow-x: auto; max-height: 400px; border: 1px solid var(--border); border-radius: 8px; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #f8fafc; position: sticky; top: 0; }
    
    .mapping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; background: #f8fafc; padding: 20px; border-radius: 12px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
    .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }
    
    .sheet-selector { background: #e0f2fe; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid #bae6fd; }
    .sheet-selector label { font-weight: 700; color: #0369a1; }
    .sheet-selector select { padding: 10px; border: 1px solid #7dd3fc; border-radius: 8px; font-size: 1rem; font-weight: 700; color: #0369a1; outline: none; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-building"></i> <span>Admin Office</span></div>
    <div class="sidebar-menu">
      <a href="index.html" class="menu-item"><i class="fas fa-home"></i> <span>Overview</span></a>
      <a href="inventory.html" class="menu-item"><i class="fas fa-boxes"></i> <span>Property Inventory</span></a>
      <a href="inventory-importer.html" class="menu-item active"><i class="fas fa-file-import"></i> <span>Import Excel</span></a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="topbar">
      <h1>📥 Import Inventory Data</h1>
    </div>

    <div class="card">
      <div class="upload-zone" onclick="document.getElementById('excel-file').click()">
        <i class="fas fa-file-excel"></i>
        <h3>Click to upload your RPCSP Excel File</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Supports .xlsx and .csv formats</p>
        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleFileUpload(this)">
      </div>
    </div>

    <!-- Sheet Selector & Preview Area -->
    <div class="card" id="preview-area" style="display: none;">
      
      <div class="sheet-selector">
        <label><i class="fas fa-layer-group"></i> Select Sheet to Import:</label>
        <select id="sheet-select" onchange="loadSelectedSheet()"></select>
      </div>

      <h3>🎯 Map Your Columns</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">Match your Excel column headers to the database fields.</p>
      
      <div class="mapping-grid" id="mapping-container"></div>

      <h3>👁️ Preview Data (First 5 rows)</h3>
      <div class="table-wrap">
        <table>
          <thead id="preview-head"></thead>
          <tbody id="preview-body"></tbody>
        </table>
      </div>

      <div style="margin-top: 20px; text-align: right;">
        <button class="btn btn-success" onclick="saveToDatabase()">
          <i class="fas fa-cloud-upload-alt"></i> Import This Sheet to Database
        </button>
      </div>
    </div>

  </main>

      <script type="module">
    import { db } from "../../assets/js/firebase-config.js";
    import { collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let workbook = null;
    let currentSheetData = [];
    let currentHeaders = [];

    // 1. Handle File Upload
    window.handleFileUpload = function(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        workbook = XLSX.read(data, { type: 'array' });
        
        const sheetSelect = document.getElementById('sheet-select');
        sheetSelect.innerHTML = workbook.SheetNames.map(name => 
          `<option value="${name}">${name}</option>`
        ).join('');

        document.getElementById('preview-area').style.display = 'block';
        loadSelectedSheet();
      };
      reader.readAsArrayBuffer(file);
    };

    // 2. Load the Selected Sheet
    window.loadSelectedSheet = function() {
      const sheetName = document.getElementById('sheet-select').value;
      const worksheet = workbook.Sheets[sheetName];
      
      const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      if (rawData.length === 0) return alert("This sheet is empty.");

      // Find the actual header row
      let headerRowIndex = -1;
      for (let i = 0; i < rawData.length; i++) {
        const row = rawData[i];
        if (!row) continue;
        const rowString = row.join(' ').toLowerCase();
        if (rowString.includes('description') && rowString.includes('property')) {
          headerRowIndex = i;
          break;
        }
      }

      if (headerRowIndex === -1) headerRowIndex = 0; 

      currentHeaders = rawData[headerRowIndex];
      currentSheetData = rawData.slice(headerRowIndex + 1);

      renderMappingUI();
      renderPreview();
    };

    // 3. Render Mapping Dropdowns & Smart Auto-Map
    function renderMappingUI() {
      const container = document.getElementById('mapping-container');
      const requiredFields = [
        { key: 'article', label: 'Article (Category)', keywords: ['article'] },
        { key: 'description', label: 'Description', keywords: ['description'] },
        { key: 'propertyNumber', label: 'Property Number', keywords: ['property', 'number'] },
        { key: 'dateAcquired', label: 'Date Acquired', keywords: ['date', 'acquisition'] },
        { key: 'unitOfMeasure', label: 'Unit of Measure', keywords: ['unit', 'measure'] },
        { key: 'unitValue', label: 'Unit Value', keywords: ['unit', 'value'] },
        { key: 'qtyPerCard', label: 'Qty (Property Card)', keywords: ['quantity', 'card'] },
        { key: 'qtyPerCount', label: 'Qty (Physical Count)', keywords: ['quantity', 'physical'] },
        { key: 'sourceOfFund', label: 'Source of Fund', keywords: ['source', 'fund'] },
        { key: 'accountableOfficer', label: 'Accountable Officer', keywords: ['accountable', 'officer'] }
      ];

      container.innerHTML = requiredFields.map(field => {
        let autoSelectedIndex = "";
        
        // SMART AUTO-MAP: Look at the headers AND the data to guess
        for (let i = 0; i < currentHeaders.length; i++) {
          const headerStr = String(currentHeaders[i]).toLowerCase();
          
          // Check if header matches keywords
          let headerMatch = field.keywords.every(kw => headerStr.includes(kw));
          
          if (headerMatch) {
            autoSelectedIndex = i;
            break;
          }
        }

        // Special handling for the two "QUANTITY" columns
        if (field.key === 'qtyPerCard') {
           // Find the first column named "quantity"
           autoSelectedIndex = currentHeaders.findIndex(h => String(h).toLowerCase() === 'quantity');
        }
        if (field.key === 'qtyPerCount') {
           // Find the second column named "quantity"
           const indices = currentHeaders.map((h, i) => String(h).toLowerCase() === 'quantity' ? i : -1).filter(i => i !== -1);
           if (indices.length > 1) autoSelectedIndex = indices[1];
        }
        if (field.key === 'accountableOfficer') {
           // Often stored under Remarks
           autoSelectedIndex = currentHeaders.findIndex(h => String(h).toLowerCase().includes('remark'));
        }

        return `
          <div class="form-group">
            <label>${field.label}</label>
            <select id="map-${field.key}">
              <option value="">-- Select Column --</option>
              ${currentHeaders.map((h, i) => `<option value="${i}" ${i == autoSelectedIndex ? 'selected' : ''}>${h || 'Column ' + (i+1)}</option>`).join('')}
            </select>
          </div>
        `;
      }).join('');

      // Force Article to use Sheet Name
      const sheetName = document.getElementById('sheet-select').value;
      const articleDropdown = document.getElementById('map-article');
      articleDropdown.innerHTML += `<option value="__SHEET_NAME__" selected>Use Sheet Name (${sheetName})</option>`;
    }

    // 4. Render Preview Table
    function renderPreview() {
      const thead = document.getElementById('preview-head');
      const tbody = document.getElementById('preview-body');

      thead.innerHTML = `<tr>${currentHeaders.map(h => `<th>${h}</th>`).join('')}</tr>`;
      
      tbody.innerHTML = currentSheetData.slice(0, 5).map(row => {
        return `<tr>${currentHeaders.map((header, i) => {
          let cellValue = row[i] || '';
          if (String(header).toLowerCase().includes('date') && typeof cellValue === 'number') {
             const dateObj = new Date(Math.round((cellValue - 25569) * 86400 * 1000));
             cellValue = dateObj.toISOString().split('T')[0];
          }
          return `<td>${cellValue}</td>`;
        }).join('')}</tr>`;
      }).join('');
    }

    // 5. Save to Firebase
    window.saveToDatabase = async function() {
      const mapping = {
        article: document.getElementById('map-article').value,
        description: document.getElementById('map-description').value,
        propertyNumber: document.getElementById('map-propertyNumber').value,
        dateAcquired: document.getElementById('map-dateAcquired').value,
        unitOfMeasure: document.getElementById('map-unitOfMeasure').value,
        unitValue: document.getElementById('map-unitValue').value,
        qtyPerCard: document.getElementById('map-qtyPerCard').value,
        qtyPerCount: document.getElementById('map-qtyPerCount').value,
        sourceOfFund: document.getElementById('map-sourceOfFund').value,
        accountableOfficer: document.getElementById('map-accountableOfficer').value,
      };

      if (!mapping.description) return alert("Please map the 'Description' column.");
      if (!mapping.qtyPerCard || !mapping.qtyPerCount) return alert("Please map the Quantity columns.");

      const sheetName = document.getElementById('sheet-select').value;
      const categoryName = sheetName.charAt(0).toUpperCase() + sheetName.slice(1);

      if (!confirm(`Import ${currentSheetData.length} rows from "${sheetName}"?`)) return;

      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing...';
      btn.disabled = true;

      let successCount = 0;

      for (const row of currentSheetData) {
        if (!row || row.length === 0 || !row[mapping.description]) continue;

        let articleVal = (mapping.article === "__SHEET_NAME__") ? categoryName : (row[mapping.article] || categoryName);
        
        let dateVal = row[mapping.dateAcquired] || "";
        if (typeof dateVal === 'number') {
             const dateObj = new Date(Math.round((dateVal - 25569) * 86400 * 1000));
             dateVal = dateObj.toISOString().split('T')[0];
        }

        const data = {
          article: articleVal,
          description: row[mapping.description] || "",
          propertyNumber: row[mapping.propertyNumber] || "",
          dateAcquired: dateVal,
          unitOfMeasure: row[mapping.unitOfMeasure] || "",
          unitValue: parseFloat(row[mapping.unitValue]) || 0,
          qtyPerCard: parseInt(row[mapping.qtyPerCard]) || 0,
          qtyPerCount: parseInt(row[mapping.qtyPerCount]) || 0,
          sourceOfFund: row[mapping.sourceOfFund] || "",
          accountableOfficer: row[mapping.accountableOfficer] || ""
        };

        data.totalCost = data.unitValue * data.qtyPerCount;

        try {
          const newDocRef = doc(collection(db, "property_inventory"));
          await setDoc(newDocRef, data);
          successCount++;
        } catch (error) {
          console.error("Error saving row:", error, row);
        }
      }

      alert(`✅ Successfully imported ${successCount} items from "${sheetName}"!`);
      
      if (confirm("Import another sheet from this file?")) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        window.scrollTo(0, 0);
      } else {
        window.location.href = "inventory.html"; 
      }
    };
  </script>
</body>
</html>
