<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Property Inventory – Admin Office</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --sidebar-bg: #0f172a;
      --bg-color: #f4f7f9;
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: 260px; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
    .sidebar-brand { padding: 30px 24px; font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sidebar-brand i { color: var(--primary-light); }
    .sidebar-menu { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; }
    .menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.2s; }
    .menu-item:hover { background: #1e293b; color: #fff; }
    .menu-item.active { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; }

    /* Main Content */
    .main-content { margin-left: 260px; flex: 1; padding: 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .topbar h1 { font-size: 1.8rem; font-weight: 800; }

    /* Buttons */
    .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #0d5e56; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; color: var(--text-muted); }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Table */
    .table-container { background: #fff; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    td { color: var(--text-main); vertical-align: middle; }
    tr:hover td { background: #f8fafc; }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-red { background: #fee2e2; color: #991b1b; }

    .action-btns { display: flex; gap: 6px; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal.show { display: flex; }
    .modal-content { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: span 2; }
    .form-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: inherit; outline: none; }
    .form-group input:focus { border-color: var(--primary); }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: #f8fafc; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-building"></i> <span>Admin Office</span></div>
    <div class="sidebar-menu">
      <a href="index.html" class="menu-item"><i class="fas fa-home"></i> <span>Overview</span></a>
      <a href="inventory.html" class="menu-item active"><i class="fas fa-boxes"></i> <span>Property Inventory</span></a>
      <a href="../registrar/index.html" class="menu-item"><i class="fas fa-file-signature"></i> <span>Registrar</span></a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="topbar">
      <h1>📦 Property Inventory</h1>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="fas fa-plus"></i> Add New Item
      </button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('high', this)">High Value (P5k - P50k)</button>
      <button class="tab-btn" onclick="switchTab('low', this)">Low Value (Under P5k)</button>
    </div>

    <div class="table-container">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Article / Description</th>
              <th>Property No.</th>
              <th>Date Acquired</th>
              <th>Unit Value</th>
              <th>Qty (Card)</th>
              <th>Qty (Count)</th>
              <th>Total Cost</th>
              <th>Officer</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-body">
            <tr><td colspan="10" style="text-align: center; padding: 30px; color: var(--text-muted);">Loading inventory data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ADD/EDIT MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">➕ Add New Property</h3>
        <button onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="itemId">
        
        <div class="form-group full">
          <label>Article / Description</label>
          <input type="text" id="f-article" placeholder="e.g. Laptop-Lenovo Thinkpad E14 Gen 5">
        </div>
        
        <div class="form-group">
          <label>Property Number</label>
          <input type="text" id="f-propertyNumber" placeholder="e.g. 2024-07-70">
        </div>
        <div class="form-group">
          <label>Date Acquired</label>
          <input type="date" id="f-dateAcquired">
        </div>

        <div class="form-group">
          <label>Unit Value (₱)</label>
          <input type="number" id="f-unitValue" placeholder="e.g. 31221" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label>Unit of Measure</label>
          <input type="text" id="f-unitOfMeasure" placeholder="e.g. PC, pcs, unit">
        </div>

        <div class="form-group">
          <label>Qty (Per Property Card)</label>
          <input type="number" id="f-qtyPerCard" value="1" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label>Qty (Physical Count)</label>
          <input type="number" id="f-qtyPerCount" value="1" oninput="calcTotal()">
        </div>

        <div class="form-group">
          <label>Total Cost (₱)</label>
          <input type="number" id="f-totalCost" readonly style="background: #f1f5f9; font-weight: bold;">
        </div>
        <div class="form-group">
          <label>Source of Fund</label>
          <input type="text" id="f-sourceOfFund" placeholder="e.g. MOOE, Central, Donation">
        </div>

        <div class="form-group full">
          <label>Accountable Officer</label>
          <input type="text" id="f-accountableOfficer" placeholder="e.g. Arman Puyao">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()" style="background: #e2e8f0; color: #333;">Cancel</button>
        <button class="btn btn-success" onclick="saveItem()">💾 Save Item</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "../../assets/js/firebase-config.js";
    import { collection, getDocs, doc, setDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let allItems = [];
    let currentTab = 'high';

    // 1. Load Data
    async function loadInventory() {
      try {
        const q = query(collection(db, "property_inventory"), orderBy("article", "asc"));
        const snap = await getDocs(q);
        allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTable();
      } catch (error) {
        console.error("Error loading inventory:", error);
        document.getElementById('inventory-body').innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">Failed to load data.</td></tr>`;
      }
    }

    // 2. Switch Tabs
    window.switchTab = function(tab, btnEl) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnEl.classList.add('active');
      renderTable();
    };

    // 3. Render Table
    function renderTable() {
      const tbody = document.getElementById('inventory-body');
      const filtered = allItems.filter(item => item.category === currentTab);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; padding: 30px; color: var(--text-muted);">No items found. Click "Add New Item" to start.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const isShort = item.qtyPerCount < item.qtyPerCard;
        const statusBadge = isShort 
          ? `<span class="badge badge-red">Shortage</span>` 
          : `<span class="badge badge-green">Complete</span>`;

        return `
          <tr>
            <td><strong>${item.article}</strong></td>
            <td style="font-family: monospace;">${item.propertyNumber || '-'}</td>
            <td>${item.dateAcquired || '-'}</td>
            <td>₱${Number(item.unitValue).toLocaleString()}</td>
            <td style="text-align: center; font-weight: bold;">${item.qtyPerCard}</td>
            <td style="text-align: center; font-weight: bold; color: ${isShort ? 'red' : 'green'};">${item.qtyPerCount}</td>
            <td>₱${Number(item.totalCost).toLocaleString()}</td>
            <td>${item.accountableOfficer || '-'}</td>
            <td>${statusBadge}</td>
            <td>
              <div class="action-btns">
                <button class="btn btn-sm" style="background: #e0f2fe; color: #0369a1;" onclick="editItem('${item.id}')" title="Edit"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}', '${item.article}')" title="Delete"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 4. Modal Controls
    window.openModal = function() {
      document.getElementById('modalTitle').textContent = "➕ Add New Property";
      document.getElementById('itemId').value = "";
      document.getElementById('f-article').value = "";
      document.getElementById('f-propertyNumber').value = "";
      document.getElementById('f-dateAcquired').value = "";
      document.getElementById('f-unitValue').value = "";
      document.getElementById('f-unitOfMeasure').value = "PC";
      document.getElementById('f-qtyPerCard').value = "1";
      document.getElementById('f-qtyPerCount').value = "1";
      document.getElementById('f-totalCost').value = "";
      document.getElementById('f-sourceOfFund').value = "";
      document.getElementById('f-accountableOfficer').value = "";
      document.getElementById('itemModal').classList.add('show');
    };

    window.closeModal = function() {
      document.getElementById('itemModal').classList.remove('show');
    };

    // 5. Auto-Calculate Total Cost
    window.calcTotal = function() {
      const unit = parseFloat(document.getElementById('f-unitValue').value) || 0;
      const qty = parseFloat(document.getElementById('f-qtyPerCount').value) || 0;
      document.getElementById('f-totalCost').value = (unit * qty).toFixed(2);
    };

    // 6. Save Item (Create or Update)
    window.saveItem = async function() {
      const id = document.getElementById('itemId').value;
      const article = document.getElementById('f-article').value.trim();
      
      if (!article) return alert("Article/Description is required.");

      const data = {
        category: currentTab,
        article: article,
        propertyNumber: document.getElementById('f-propertyNumber').value.trim(),
        dateAcquired: document.getElementById('f-dateAcquired').value,
        unitValue: parseFloat(document.getElementById('f-unitValue').value) || 0,
        unitOfMeasure: document.getElementById('f-unitOfMeasure').value.trim(),
        qtyPerCard: parseInt(document.getElementById('f-qtyPerCard').value) || 0,
        qtyPerCount: parseInt(document.getElementById('f-qtyPerCount').value) || 0,
        totalCost: parseFloat(document.getElementById('f-totalCost').value) || 0,
        sourceOfFund: document.getElementById('f-sourceOfFund').value.trim(),
        accountableOfficer: document.getElementById('f-accountableOfficer').value.trim(),
      };

      try {
        if (id) {
          // Update existing
          await setDoc(doc(db, "property_inventory", id), data, { merge: true });
        } else {
          // Create new
          const newDocRef = doc(collection(db, "property_inventory"));
          await setDoc(newDocRef, data);
        }
        
        closeModal();
        await loadInventory();
      } catch (error) {
        console.error("Save Error:", error);
        alert("Error saving item: " + error.message);
      }
    };

    // 7. Edit Item
    window.editItem = function(id) {
      const item = allItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalTitle').textContent = "✏️ Edit Property";
      document.getElementById('itemId').value = item.id;
      document.getElementById('f-article').value = item.article || "";
      document.getElementById('f-propertyNumber').value = item.propertyNumber || "";
      document.getElementById('f-dateAcquired').value = item.dateAcquired || "";
      document.getElementById('f-unitValue').value = item.unitValue || "";
      document.getElementById('f-unitOfMeasure').value = item.unitOfMeasure || "";
      document.getElementById('f-qtyPerCard').value = item.qtyPerCard || "";
      document.getElementById('f-qtyPerCount').value = item.qtyPerCount || "";
      document.getElementById('f-totalCost').value = item.totalCost || "";
      document.getElementById('f-sourceOfFund').value = item.sourceOfFund || "";
      document.getElementById('f-accountableOfficer').value = item.accountableOfficer || "";
      
      document.getElementById('itemModal').classList.add('show');
    };

    // 8. Delete Item
    window.deleteItem = async function(id, article) {
      if (!confirm(`Are you sure you want to delete "${article}"?\n\nThis action cannot be undone.`)) return;

      try {
        await deleteDoc(doc(db, "property_inventory", id));
        await loadInventory();
      } catch (error) {
        console.error("Delete Error:", error);
        alert("Error deleting item: " + error.message);
      }
    };

    document.addEventListener('DOMContentLoaded', loadInventory);
  </script>
</body>
</html>
